syntax = "proto3";

package woohaa.canvas.v1;

option go_package = "woohaa3/api/gen/go/woohaa/canvas/v1;canvasv1";

// 画布权限分成三层，接口按层拆开，不共用同一组动作：
//
//  1. **作者**（创建者）拥有这张画布：改内容、改分享、邀请协作者、删除。
//  2. **协作者**由作者或管理员授予，只有两档：viewer 只读、editor 可写。
//  3. **管理端**（部署管理员）能看任何画布、合并快照、强制删除，但**不**改画布内容。
//
// canvas_id 由服务端分配：客户端自报 id 会让"先连上就先占住这个名字"成立，
// 而一个可预测的 id 在作者通道之下等于一次免费接管。

message CanvasStats {
  string canvas_id = 1;
  // 当前存储的记录条数（快照算一条）。
  uint32 record_count = 2;
  uint64 total_bytes = 3;
  // 快照覆盖到的 seq；0 表示还没有合并过。
  uint64 snapshot_covers_seq = 4;
  // 最新一条记录的游标。
  uint64 head_seq = 5;
}

// 一条已持久化记录的元数据。字节不在列表里：清单回答"这条画布由哪些记录组成、
// 快照覆盖到哪里"，读字节是另一个动作（AdminReadCanvasRecords）。
message CanvasRecord {
  // 记录主键，单调递增。普通 update 的游标就是它。
  uint64 seq = 1;
  // 记录对外暴露的游标：普通记录等于 seq，快照是它覆盖到的最大 seq。
  // 客户端断线续传用的就是它，因此和 seq 不是同一个概念。
  uint64 cursor = 2;
  uint64 size_bytes = 3;
  bool snapshot = 4;
  // 仅快照有值：快照覆盖到的最大 seq。
  uint64 covers = 5;
}

message AdminListCanvasRecordsRequest {
  string canvas_id = 1;
  // 从该 seq 之后开始，按 seq 升序；0 表示从最早一条开始。
  uint64 after_seq = 2;
  // 缺省 100，上限 500。
  int32 page_size = 3;
}

message AdminListCanvasRecordsResponse {
  repeated CanvasRecord records = 1;
  // 下一页的 after_seq；0 表示没有更多。快照与它后面的 update 一起返回，
  // 因此调用方不需要理解"快照覆盖到哪"就能按顺序应用。
  uint64 next_after_seq = 2;
}

// 记录元数据 + 字节。字节原样返回，服务端不解析 Yjs。
message CanvasRecordData {
  CanvasRecord record = 1;
  bytes data = 2;
}

message AdminReadCanvasRecordsRequest {
  string canvas_id = 1;
  // 从该 seq 之后开始，按 seq 升序；0 表示从最早一条开始。
  uint64 after_seq = 2;
  // 单次最多返回的字节数；缺省 1 MiB，上限 4 MiB。按整条记录截断
  // （不会返回半条记录，调用方不需要处理不完整的 Yjs update）。
  //
  // 预算是软的：至少总会返回一条记录，即使它自己就超过预算——否则一份大快照
  // 永远读不到，调用方也无法把它降到更小的页。此时 `more` 仍为 true，
  // 调用方应以 `next_after_seq` 继续。
  uint32 max_bytes = 3;
}

message AdminReadCanvasRecordsResponse {
  repeated CanvasRecordData records = 1;
  // 下一页的 after_seq；0 表示没有更多。
  uint64 next_after_seq = 2;
  // 是否还有更多（因字节预算或分页上限而停）。等价于 `next_after_seq != 0`，
  // 单独给出是为了让"被预算截断"在界面上可以直说。
  bool more = 3;
}

// 协作者角色。只有两档：分享共创不需要更多。
enum CanvasRole {
  CANVAS_ROLE_UNSPECIFIED = 0;
  // 只读协同：能同步、能看，不能提交命令。
  CANVAS_ROLE_VIEWER = 1;
  // 可写协同：能改内容，不能改分享、不能删除。
  CANVAS_ROLE_EDITOR = 2;
}

// 画布生命周期。删除是墓碑：已删除的画布返回 410，不会因为再次访问而重建。
enum CanvasState {
  CANVAS_STATE_UNSPECIFIED = 0;
  CANVAS_STATE_ACTIVE = 1;
  CANVAS_STATE_DELETING = 2;
  CANVAS_STATE_DELETED = 3;
}

// 分享链接的开放程度。
//
// RESTRICTED 只认作者与显式协作者；EVERYONE_VIEW / EVERYONE_EDIT 让**拿到链接且已认证**
// 的用户可读（EDIT 时可写）。这不是匿名公开：未登录仍然进不来，链接也不会让画布出现在
// 对方目录里，更不带来分享设置、删除或成员管理。
enum CanvasShareMode {
  CANVAS_SHARE_MODE_UNSPECIFIED = 0;
  // 只有作者与协作者能访问。
  CANVAS_SHARE_MODE_RESTRICTED = 1;
  // 拿到链接的已认证用户可只读。
  CANVAS_SHARE_MODE_EVERYONE_VIEW = 2;
  // 拿到链接的已认证用户可写（仍不含分享设置、删除与成员管理）。
  CANVAS_SHARE_MODE_EVERYONE_EDIT = 3;
}

// 画布元数据。内容不在里面：文档只经 /ws 会话同步，服务端不解析 Yjs。
message Canvas {
  string canvas_id = 1;
  // 创建者（作者）。空表示没有登记属主，这类画布只对管理员与已授权的协作者可见。
  string created_by = 2;
  CanvasState state = 3;
  // 创建时间，RFC 3339。
  string created_at = 4;
  // 最近一次元数据变化（改名、成员变化、删除），RFC 3339。
  string updated_at = 5;
  // 标题。服务端只把它当展示字段，不参与判定。
  string title = 6;
  // 调用者在这张画布上的角色；为空表示调用者既不是作者也不是协作者
  // （管理员看别人的画布时就是这种情况）。
  CanvasRole role = 7;
  // 调用者是不是作者。
  bool is_owner = 8;
  // 调用者在这张画布上的有效动作（canvas.read / canvas.write / canvas.share /
  // canvas.compact / rbac.manage）。客户端据此渲染，不要自己再推一遍。
  repeated string allowed_actions = 9;
}

message CreateCanvasRequest {
  // 可选标题；为空时服务端留空，不猜一个占位标题。
  string title = 1;
}

message CreateCanvasResponse {
  Canvas canvas = 1;
}

message GetCanvasRequest {
  string canvas_id = 1;
}

message GetCanvasResponse {
  Canvas canvas = 1;
}

message RenameCanvasRequest {
  string canvas_id = 1;
  string title = 2;
  // 期望的 updated_at；非空时与库中不一致返回 ABORTED（避免两人同时改名互相覆盖）。
  string expected_updated_at = 3;
}

message RenameCanvasResponse {
  Canvas canvas = 1;
}

message DeleteCanvasRequest {
  string canvas_id = 1;
}

message DeleteCanvasResponse {}

// "我的画布"：作为作者或协作者的那些。
//
// 它**不**包含"我能看到的其他画布"——管理员能看到全站，但别人的画布不会因此出现在
// 他的目录里。全量列表是管理端的 AdminListCanvases。
message ListMyCanvasesRequest {}

message ListMyCanvasesResponse {
  repeated Canvas canvases = 1;
}

// 管理端全量列表。
message AdminListCanvasesRequest {
  // 包含已删除（墓碑）的画布。默认 false。
  bool include_deleted = 1;
  // 为 true 时一并返回存储统计（管理端运维页需要）。
  bool include_stats = 2;
}

message AdminListCanvasesResponse {
  repeated Canvas canvases = 1;
  // 与 canvases 按 canvas_id 对齐的统计；include_stats=false 时为空。
  repeated CanvasStats stats = 2;
}

// 协作者关系。作者本人不在成员表里：作者身份只有一个来源（Canvas.created_by）。
message CanvasMember {
  string actor_id = 1;
  CanvasRole role = 2;
  // 授予者；空表示来自迁移（迁移前的画布级绑定没有记录操作者）。
  string granted_by = 3;
  // RFC 3339。
  string granted_at = 4;
}

message ListCanvasMembersRequest {
  string canvas_id = 1;
}

message ListCanvasMembersResponse {
  // 创建者。
  string owner = 1;
  repeated CanvasMember members = 2;
}

message UpsertCanvasMemberRequest {
  string canvas_id = 1;
  string actor_id = 2;
  CanvasRole role = 3;
}

message UpsertCanvasMemberResponse {
  CanvasMember member = 1;
}

message RemoveCanvasMemberRequest {
  string canvas_id = 1;
  string actor_id = 2;
}

message RemoveCanvasMemberResponse {}

// TransferCanvas 把作者身份转给另一个主体（离职代管、项目移交）。
//
// 旧作者的去向必须显式声明，**不**默认保留任何访问：默认是彻底移交（连读都读不到）。
// "你继续能编辑但不再是作者"是一种真实需求，因此用 previous_owner_role 显式表达，
// 而不是让调用方先转让再自己补一次 Grant——那中间失败会让人直接失去访问。
message TransferCanvasRequest {
  string canvas_id = 1;
  string new_owner = 2;
  // 旧作者转让后的角色。UNSPECIFIED 表示彻底移交（移除全部访问）。
  CanvasRole previous_owner_role = 3;
}

message TransferCanvasResponse {
  Canvas canvas = 1;
}

// 一条画布协作邀请。
//
// 邀请由服务端签发：链接形如 `<public_base_url>/invite/<token>`。持有链接的人在企业网关
// 注入身份后可以在服务端的分享页上点「接受」；客户端也可以带自己的会话调用
// `AcceptCanvasInvite`（同一个 token，同一张邀请）。
//
// token 只在创建时返回一次，服务端只保存它的哈希；列表里因此没有链接，需要再分享时
// 重新创建一条邀请（旧链接仍然有效，到期或撤销为止）。
message CanvasInvite {
  string invite_id = 1;
  CanvasRole role = 2;
  string created_by = 3;
  string created_at = 4;
  // RFC 3339；服务端保证非空。
  string expires_at = 5;
  int32 accepted_count = 6;
  // 最近一次被接受的时间；没人接受时为空。
  string last_accepted_at = 7;
  bool revoked = 8;
}

message CreateCanvasInviteRequest {
  string canvas_id = 1;
  CanvasRole role = 2;
  // 有效期秒数。0 取服务端默认（7 天）；超过上限（90 天）按上限收紧。
  int64 expires_in_seconds = 3;
}

message CreateCanvasInviteResponse {
  string invite_id = 1;
  CanvasRole role = 2;
  string expires_at = 3;
  // 服务端按部署配置拼好的绝对地址；未配置对外地址时为空，客户端必须据此报错而不是自己拼。
  string url = 4;
}

message ListCanvasInvitesRequest {
  string canvas_id = 1;
}

message ListCanvasInvitesResponse {
  repeated CanvasInvite invites = 1;
}

message RevokeCanvasInviteRequest {
  string canvas_id = 1;
  string invite_id = 2;
}

message RevokeCanvasInviteResponse {}

message AcceptCanvasInviteRequest {
  // 邀请链接里的 token。持有它即可接受，但服务端仍要求已认证主体。
  string token = 1;
}

message AcceptCanvasInviteResponse {
  Canvas canvas = 1;
}

message GetCanvasShareRequest {
  string canvas_id = 1;
}

message GetCanvasShareResponse {
  CanvasShareMode mode = 1;
  // 分享设置的修订号；更新时回传它做并发校验。
  int64 revision = 2;
}

message UpdateCanvasShareRequest {
  string canvas_id = 1;
  CanvasShareMode mode = 2;
  // 上一次读到的 revision；0 表示"按当前值更新"，非 0 时不一致返回 ABORTED。
  int64 expected_revision = 3;
}

message UpdateCanvasShareResponse {
  CanvasShareMode mode = 1;
  int64 revision = 2;
}

message ListCanvasesRequest {}

message ListCanvasesResponse {
  repeated CanvasStats canvases = 1;
}

message GetCanvasStatsRequest {
  string canvas_id = 1;
}

message GetCanvasStatsResponse {
  CanvasStats stats = 1;
}

message CompactCanvasRequest {
  string canvas_id = 1;
}

message CompactCanvasResponse {
  CanvasStats before = 1;
  CanvasStats after = 2;
}

// 画布接口。文档内容只通过 /ws 会话同步，服务端不解析 Yjs。
service CanvasService {
  // 创建一张画布，调用者成为作者。canvas_id 由服务端分配。
  rpc CreateCanvas(CreateCanvasRequest) returns (CreateCanvasResponse);
  rpc GetCanvas(GetCanvasRequest) returns (GetCanvasResponse);
  rpc RenameCanvas(RenameCanvasRequest) returns (RenameCanvasResponse);
  // 删除画布（墓碑）。作者与管理员都能删；删除后访问返回 410，不会自动重建。
  rpc DeleteCanvas(DeleteCanvasRequest) returns (DeleteCanvasResponse);
  // 我的画布（作者或协作者）。
  rpc ListMyCanvases(ListMyCanvasesRequest) returns (ListMyCanvasesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // 部署管理员的画布清单。非管理员一律拒绝（不是返回空列表）。
  rpc AdminListCanvases(AdminListCanvasesRequest) returns (AdminListCanvasesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // 管理端：记录与快照清单（只有元数据）。用于回答"这张画布由哪些记录组成、
  // 快照覆盖到哪、最近有没有异常增长"。非部署管理员拒绝。
  rpc AdminListCanvasRecords(AdminListCanvasRecordsRequest) returns (AdminListCanvasRecordsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // 管理端：按 seq 升序读取记录字节，用于多版本解码与对比。服务端不解析 Yjs，
  // 也不在这里替调用方合并；调用方按顺序把 update 应用到一个文档上即可重建版本。
  // 字节预算按整条记录截断，因此返回的每条都是完整可应用的 update。
  rpc AdminReadCanvasRecords(AdminReadCanvasRecordsRequest) returns (AdminReadCanvasRecordsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // 协作者管理。作者与管理员能读写；协作者通过 GetCanvas 读自己的角色。
  rpc ListCanvasMembers(ListCanvasMembersRequest) returns (ListCanvasMembersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc UpsertCanvasMember(UpsertCanvasMemberRequest) returns (UpsertCanvasMemberResponse);
  rpc RemoveCanvasMember(RemoveCanvasMemberRequest) returns (RemoveCanvasMemberResponse);
  rpc TransferCanvas(TransferCanvasRequest) returns (TransferCanvasResponse);
  // 协作邀请。创建/撤销走管理动作（作者或部署管理员），接受由持有链接的已认证主体完成。
  rpc CreateCanvasInvite(CreateCanvasInviteRequest) returns (CreateCanvasInviteResponse);
  rpc ListCanvasInvites(ListCanvasInvitesRequest) returns (ListCanvasInvitesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc RevokeCanvasInvite(RevokeCanvasInviteRequest) returns (RevokeCanvasInviteResponse);
  rpc AcceptCanvasInvite(AcceptCanvasInviteRequest) returns (AcceptCanvasInviteResponse);
  rpc GetCanvasShare(GetCanvasShareRequest) returns (GetCanvasShareResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc UpdateCanvasShare(UpdateCanvasShareRequest) returns (UpdateCanvasShareResponse);
  // 立即把该画布的 update 合并成一份快照（平时由服务端按阈值定期执行）。
  // 这是运维动作，只有部署管理员能做：画布级 admin 不再能触发。
  rpc CompactCanvas(CompactCanvasRequest) returns (CompactCanvasResponse);
  // 单张画布的存储统计。作者、协作者与管理员都能看。
  rpc GetCanvasStats(GetCanvasStatsRequest) returns (GetCanvasStatsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // 兼容别名：等价于 AdminListCanvases(include_deleted=false, include_stats=true)。
  rpc ListCanvases(ListCanvasesRequest) returns (ListCanvasesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}
