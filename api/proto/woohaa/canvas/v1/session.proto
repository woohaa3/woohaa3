syntax = "proto3";

package woohaa.canvas.v1;

option go_package = "woohaa3/api/gen/go/woohaa/canvas/v1;canvasv1";

// 画布会话 WebSocket（/ws/canvases/{canvas_id}）的帧契约。
//
// 每条 WebSocket binary message 恰好是一个 ClientFrame 或 ServerFrame。
// Yjs update 与 awareness 以 bytes 原样承载：服务端只转发与持久化，从不解析文档。
//
// 游标（seq）由服务端存储分配，单调递增。客户端记住最近一次 Synced.seq，
// 重连时放进 Hello.after_seq，服务端只补发其后的记录，因此不需要计算 Yjs 差量。

enum SessionProtocolVersion {
  SESSION_PROTOCOL_VERSION_UNSPECIFIED = 0;
  SESSION_PROTOCOL_VERSION_1 = 1;
}

message ClientFrame {
  oneof frame {
    Hello hello = 1;
    ClientUpdate update = 2;
    AwarenessUpdate awareness = 3;
    // 画布标题（展示元数据）。客户端在标题变化后、以及每次同步完成后发送；
    // 服务端只对可写连接应用，用于管理端展示可读名称（服务端不解析 Yjs）。
    ClientTitle title = 4;
  }
}

// 画布标题声明。
//
// 为什么走会话帧而不是另开一次 RenameCanvas：标题的权威值在客户端文档里（Yjs `meta.title`），
// 改名已经是画布命令，durable 之后 published 文档就有了新标题；同步链路只需要把它顺带
// 声明给服务端。另开 HTTP 调用会让"本地已改名、服务端还是旧名"之间存在第二条失败路径，
// 而且本机宿主并不持有可自行调用管理面 RPC 的会话。
//
// 服务端把它当**展示字段**：校验长度、只对可写连接应用、失败只记日志（不影响同步）；
// 不落 Yjs、不广播——其他客户端通过文档本身拿到标题。最后写入者生效。
message ClientTitle {
  // 新的画布标题，≤512 字节，空串表示清空标题。
  string title = 1;
}

message ServerFrame {
  oneof frame {
    Welcome welcome = 1;
    StoredUpdate update = 2;
    UpdateAck ack = 3;
    Synced synced = 4;
    AwarenessUpdate awareness = 5;
    SessionError error = 6;
  }
}

// 连接后的第一帧；服务端收到前不发送任何文档内容。
message Hello {
  SessionProtocolVersion version = 1;
  // 客户端已有数据所属的 room epoch；为空或与服务端不一致时，服务端从头补发。
  string room_epoch = 2;
  uint64 after_seq = 3;
  // 客户端**本地已有内容、且这是首次把它推给远端**。
  //
  // 这套部署是本地优先：画布 id 在客户端生成，远端第一次见到某个 id 往往就是一次
  // 同步推送。远端因此不能要求"先调用 CreateCanvas 才能同步"——那会让所有离线创建
  // 的画布永远同步不上去。设置本字段即声明"如果远端没见过这个 id，请登记它并把
  // 本次调用者记为作者"。
  //
  // 必须显式声明，不能由"连上就登记"推出：只读打开、以及本地缺失时拉远端快照
  // （同样发空 room_epoch/after_seq）都不该变成一次认领。
  //
  // 远端已在别的属主名下时，这次连接以不可重试的 `canvas-taken` 结束。
  bool create_if_missing = 4;
  // 画布的展示标题，可选，最多 512 个字符。
  //
  // 画布内容（含标题）只存在于客户端文档里，服务端从不解析；因此管理端要展示可读的
  // 画布名，只能由客户端在会话里顺带声明。它只用于展示与检索，**不参与**任何授权或
  // 存在性判定，也不会覆盖一张已有标题的画布：服务端只在登记新画布、或已有画布标题
  // 为空且调用者是作者时采用它（见 canvasacl.Claim）。
  //
  // 空串表示"没有可声明的标题"（旧客户端、未命名画布），服务端保持原值。
  string title = 5;
  // 客户端自报的展示元数据（可选）。见 ClientInfo。
  ClientInfo client = 6;
}

// 客户端在 Hello 里自报的展示元数据。
//
// 它**只用于观测与排障**（管理端画布调试通道的客户端描述），不参与鉴权、授权、同步
// 与任何判定：服务端把内容原样转给观测通道并截断超长值，绝不据此放行或拒绝任何动作。
// 这也是为什么它必须在 Hello 里声明，而不是走握手头：浏览器无法为 WebSocket 设置
// 自定义请求头，而本机宿主既可能是浏览器直连也可能是 Node 进程直连。
//
// 旧客户端不发送时三个字段都为空，观测端只留空而不是报错。
message ClientInfo {
  // 客户端产品名，例如 `woohaa3-host`、`woohaa3-web`。
  string name = 1;
  // 客户端版本，例如 `0.1.0` 或 `v1.4.2-3-gabc1234`。
  string version = 2;
  // 平台描述，例如 `darwin-arm64`、`browser`。
  string platform = 3;
}

// 客户端产生的本地 Yjs update。
message ClientUpdate {
  // 连接内唯一，用于匹配 UpdateAck；未确认的 update 由客户端在重连后重发。
  uint64 client_seq = 1;
  bytes update = 2;
}

message Welcome {
  SessionProtocolVersion version = 1;
  string room_epoch = 2;
  string actor_id = 3;
  // false 时服务端会丢弃该连接发来的 ClientUpdate。
  bool can_write = 4;
}

// 一条已持久化的记录（普通 update 或合并后的快照）。
message StoredUpdate {
  uint64 seq = 1;
  bytes update = 2;
  bool snapshot = 3;
}

// ClientUpdate 已持久化。发起方不会再收到同一条 update 的 StoredUpdate 广播。
message UpdateAck {
  uint64 client_seq = 1;
  uint64 seq = 2;
}

// 初始补发结束；seq 是此刻可用作 Hello.after_seq 的游标。
message Synced {
  uint64 seq = 1;
}

// y-protocols/awareness 编码；服务端只转发，不持久化。
message AwarenessUpdate {
  bytes update = 1;
}

message SessionError {
  string code = 1;
  string message = 2;
  // false 表示客户端不应自动重连（例如版本不兼容）。
  bool retryable = 3;
}
