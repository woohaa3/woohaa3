syntax = "proto3";

package woohaa.canvas.v1;

import "google/protobuf/timestamp.proto";
import "woohaa/canvas/v1/session.proto";

option go_package = "woohaa3/api/gen/go/woohaa/canvas/v1;canvasv1";

// 画布会话的实时观测通道（部署管理员专用，`GET /ws/admin/canvases/{canvas}`）。
//
// 这条通道**只读**：它不加入房间、不参与同步、不能写入，也不出现在其他协作者的
// awareness 里。它看到的是本实例上的会话活动；跨实例转发过来的帧也会作为
// `remote = true` 的服务端帧出现，但其他实例上客户端的原始行为不属于本实例的观测范围。
//
// 为什么不复用普通客户端连接：普通连接只能看到广播给自己的 ServerFrame，
// 看不到其他客户端发来的 ClientFrame（Hello、update、awareness），也看不到
// 连接建立/断开原因与"补发了多少历史"。观测通道把这些事实作为一等事件下发。
//
// 帧格式：每条 WebSocket binary message 恰好是一个 InspectorFrame。载荷字节
// （`raw`）原样保留，解析后的字段另外给出——排障既需要看到字节，也需要看到解释。
message InspectorFrame {
  // 本实例内单调递增的事件序号，仅用于排序与定位，不跨实例。
  uint64 event_id = 1;
  // 事件发生时刻，由服务端记录。
  google.protobuf.Timestamp at = 2;
  InspectorDirection direction = 3;
  InspectorKind kind = 4;
  // 事件所属主体（客户端连接的身份）。NOTICE 与跨实例事件可能为空。
  string actor_id = 5;
  // 该事件对应记录的游标（UPDATE 事件）。
  uint64 seq = 6;
  // 客户端自报的 client_seq（UPDATE 事件），用于对照 UpdateAck。
  uint64 client_seq = 7;
  // 该记录是否是合并后的快照（UPDATE 事件）。
  bool snapshot = 8;
  // 原始载荷字节。READY 为空；JOIN 是客户端 Hello 的原始字节；UPDATE 是 Yjs update；
  // AWARENESS 是 awareness 编码。跨实例事件保留转发过来的原始帧载荷。
  bytes raw = 9;
  // `raw` 的字节数。单独给出是为了让界面不必先拿到载荷就能排序/聚合。
  uint64 size = 10;
  // 在本事件之前因订阅端消费过慢而被丢弃的事件数。0 表示没有丢弃。
  uint32 dropped = 11;
  // 是否来自其他实例的跨实例转发。转发只在 update 与 awareness 上发生。
  bool remote = 12;
  // 人类可读的补充说明（断开原因、错误文本、就绪摘要）。不是机器可解析字段。
  string detail = 13;
  // 仅 JOIN 事件携带：客户端 Hello 的结构化字段。`raw` 里是它的原始字节。
  Hello hello = 14;
  // 仅 JOIN 事件携带：本次连接是否可写（与 Welcome.can_write 同源）。
  bool can_write = 15;
  // 仅 JOIN 事件携带：加入时补发的历史记录条数（含快照）。
  uint32 replay_records = 16;
  // 仅 READY 事件携带：订阅那一刻的房间状态。
  InspectorSession session = 17;
  // 事件所属的客户端连接描述。JOIN / LEAVE / UPDATE / AWARENESS / TITLE 携带；
  // READY、跨实例转发帧与无法归属到某条连接的事件为空。
  //
  // 为什么需要它：`actor_id` 只到账号级别，同一账号开两个窗口、或两个设备用同一份
  // 凭证时无法区分。`client_no` 把事件归属细化到**连接**，其余字段回答"这条连接是
  // 谁、从哪来、什么版本"。
  InspectorClient client = 18;
}

// 一条客户端连接的身份与来源。所有字段都是**观测信息**，不参与任何判定。
//
// 数据来源分三类，界面必须按来源区分可信度：
//   1. 服务端在握手时观察到的：`remote_addr`、`forwarded_for`、`user_agent`；
//   2. 服务端鉴权得到的：`actor_id`、`display_name`、`subject_type`、`can_write`；
//   3. 客户端在 Hello 里自报的：`client_name`、`client_version`、`platform`（不可信）。
message InspectorClient {
  // 房间内连接编号，从 1 开始单调递增。重连是一条新连接，会拿到新编号；
  // 房间回收（所有连接与观测者都离开）后重新从 1 开始。
  uint32 client_no = 1;
  // 鉴权主体（归属账号）。开发模式下是服务端生成的匿名 id。
  string actor_id = 2;
  // 主体展示名（网关登录名或主体档案名），没有时为空。
  string display_name = 3;
  // 主体类型：`user`（人类）/ `machine`（机器凭证）。零值为空。
  string subject_type = 4;
  // 建连的 TCP 对端地址（含端口）。服务端在反向代理后面时这里是代理地址，
  // 真实来源需要看 `forwarded_for`。
  string remote_addr = 5;
  // 握手请求里的 `X-Forwarded-For` 原文（未经过代理时为空）。服务端不解析、
  // 不据此做任何判定；它可能被客户端伪造，只作为排障线索。
  string forwarded_for = 6;
  // 握手请求里的 `User-Agent` 原文（客户端未提供时为空）。
  string user_agent = 7;
  // 客户端在 Hello.client 里自报的产品名 / 版本 / 平台（旧客户端为空）。
  string client_name = 8;
  string client_version = 9;
  string platform = 10;
  // 这条连接加入房间的时刻（服务端时钟）。
  google.protobuf.Timestamp joined_at = 11;
  // 加入时该连接是否可写（与 Welcome.can_write 同源）。
  bool can_write = 12;
}

// 事件方向。
enum InspectorDirection {
  INSPECTOR_DIRECTION_UNSPECIFIED = 0;
  // 客户端发往服务端。
  INSPECTOR_DIRECTION_CLIENT_TO_SERVER = 1;
  // 服务端发往客户端。当前只用于跨实例转发来的帧（本实例的广播可由
  // CLIENT_TO_SERVER 事件 + 房间状态推出，再发一遍只会让时间线翻倍）。
  INSPECTOR_DIRECTION_SERVER_TO_CLIENT = 2;
  // 服务端自己产生的事实（连接建立/断开、就绪）。
  INSPECTOR_DIRECTION_NOTICE = 3;
}

// 事件种类。
enum InspectorKind {
  INSPECTOR_KIND_UNSPECIFIED = 0;
  // 订阅成功后的第一条：当前房间状态。之后的 event_id 从它之后继续。
  INSPECTOR_KIND_READY = 1;
  // 一条客户端连接完成了握手、登记与鉴权，加入了房间。
  INSPECTOR_KIND_JOIN = 2;
  // 一条客户端连接结束了（正常关闭、权限撤销、画布删除、慢消费者等）。
  INSPECTOR_KIND_LEAVE = 3;
  // 客户端提交了一条已持久化的 update。`seq` 是服务端分配的游标。
  INSPECTOR_KIND_UPDATE = 4;
  // 客户端提交了一次 awareness（光标/在线状态），服务端只转发、不持久化。
  INSPECTOR_KIND_AWARENESS = 5;
  // 服务端下发的错误帧（会话被拒绝或即将关闭）。
  INSPECTOR_KIND_ERROR = 6;
  // 客户端声明了画布标题（展示元数据，走 ClientTitle 帧）。它不产生记录。
  INSPECTOR_KIND_TITLE = 7;
}

// 订阅那一刻的房间状态。它回答"我接上的时候这张画布是什么样"，
// 而不是一条随时间变化的时间线——后续变化以事件给出。
message InspectorSession {
  string canvas_id = 1;
  // 房间 epoch：客户端据此判断本地缓存是不是同一份数据。
  string room_epoch = 2;
  // 当前最新一条记录的游标（快照为其覆盖到的最大 seq）。
  uint64 head_seq = 3;
  // 当前存储的记录条数（快照算一条）。
  uint64 record_count = 4;
  uint64 total_bytes = 5;
  // 订阅那一刻房间内的客户端连接数（不含本观测连接）。
  uint32 client_connections = 6;
  // 观测范围。当前恒为 true：跨实例转发可见，其他实例的客户端行为不可见。
  bool local_instance_only = 7;
  // 订阅那一刻房间内每条客户端连接的描述，按 `client_no` 升序。
  //
  // 与 `client_connections` 冗余是有意的：前者是计数，后者能回答"到底是谁连着"。
  // 之后加入的连接以 JOIN 事件出现，离开以 LEAVE 出现；`client_connections` 不再变化。
  repeated InspectorClient clients = 8;
}
