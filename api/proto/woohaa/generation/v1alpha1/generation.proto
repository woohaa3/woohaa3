syntax = "proto3";

package woohaa.generation.v1alpha1;

import "google/protobuf/struct.proto";

option go_package = "woohaa3/api/gen/go/woohaa/generation/v1alpha1;generationv1alpha1";

// 服务端托管生成的冻结契约。
//
// 版本承诺：包名是 v1alpha1，但**本组消息、字段号与语义从第一次发布起视为冻结**。
// 目标只有一个：服务端按本契约实现之后，**当前已经发布出去的客户端不需要更新**就能
// 使用它。因此这里没有"以后再补"的语义，也不留绕过冻结的豁免口。
//
// 四条硬约定（字面量与客户端既有契约一致，改动它们等于要求客户端发版）：
//
//  1. **词汇是字符串，状态是枚举**。`model_type` / `prompt_requirement` / `cancel` /
//     `semantic` / `media_kind` 一律使用小写字符串，与客户端联合类型同字面量；
//     `TaskState` 用枚举，客户端必须穷举，`TASK_STATE_UNSPECIFIED` 一律按失败处理。
//     新增取值只能追加，不得改字面量或含义。
//  2. **业务失败走任务状态 + 稳定码，不走 RPC 错误**。RPC 错误只表示"调用是否到达
//     服务端"（未认证、无权限、参数非法、服务不可用）；任务自身的失败是
//     `TASK_STATE_FAILED` + `TaskFailure.code`，码与客户端既有稳定码表同字面量。
//     这样远程传输层不需要保留业务细节，失败语义也不会随传输形态改变。
//  3. **结果只给稳定 `storage_key` 与 metadata，不给签名地址**。对象由服务端写在任务
//     所属画布的作用域里，客户端用自己的存储后端按同一作用域读取。签名地址会过期，
//     也不得进入历史，因此响应里没有它。
//  4. **提交只收稳定引用**。参考素材以 `asset_id` / `storage_key` 表达；服务端不抓取
//     调用方给的任何地址，也不接收字节通道。
//
// 演进规则（只增不改）：可以新增 RPC、追加字段、新增 `features` 值与新的字符串取值；
// 客户端必须忽略未知字段、未知 feature、未知 `model_type` 与未知 interaction，并按
// 单个模型降级，不得因服务端多给一项就让整份目录不可用。
//
// 本文件及其生成的公开文档不得出现内网地址、密钥、客户名或内部代号。

// 服务端托管生成。执行模型是"客户端轮询"：提交立即返回，读取轮询到终态。
//
// 调用方是本机宿主而不是浏览器，Bearer 会话只在宿主内。授权分两层：所有 RPC 都要求
// 已认证，涉及具体画布的 RPC 再按画布 ACL 判定（提交/取消要 `canvas.write`，读取要
// `canvas.read`）。目录是部署级读，不按画布过滤——它回答的是"这台部署能提供什么"。
service GenerationService {
  // 协议协商：版本、feature、轮询建议与限额。
  //
  // 客户端先调它，再决定是否使用本服务：`protocol_version` 不等于客户端内置版本，或
  // `features` 不含 `catalog` 时，客户端应关闭本 Provider 并保持本地正常态，不把它
  // 呈现为故障。服务端尚未实现本服务时返回 unimplemented，客户端同样保持休眠。
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);

  // 服务端权威模型目录。部署级只读：只要求已认证，不按画布或主体过滤。
  //
  // `catalog_revision` 单调递增，客户端只用它判断"目录变了、需要重新取"；目录条目
  // 本身才是事实来源。加模型、删模型、只改单个模型的 schema/能力都应该让它前进。
  rpc GetCatalog(GetCatalogRequest) returns (GetCatalogResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 幂等受理任务，立即返回，不等待终态。
  //
  // `idempotency_key` 由客户端生成（它的 `workerTaskKey`）：同 key 同 payload 返回首次
  // 受理的任务（`reused=true`，不重复创建上游任务）；同 key 不同 payload MUST NOT 创建
  // 第二个任务，MUST 以稳定码 `key-reused` 收敛。被稳定拒绝的受理不产生上游任务。
  //
  // 授权：已认证且调用者对该 `canvas_id` 有 `canvas.write`。
  rpc SubmitTask(SubmitTaskRequest) returns (SubmitTaskResponse);

  // 读取任务状态、进度、结果与稳定错误。按 `record_revision` 单调。
  //
  // 授权：已认证且调用者对该任务所属画布有 `canvas.read`。任务不在调用者可读范围
  // 时与"任务不存在"返回同一结论，不得变成存在性探测。
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 幂等取消：重复取消返回当前状态，已是终态时不做改变。
  //
  // 取消是"请求"，终态异步收敛；返回的 `state` 可能仍是进行中。模型声明
  // `cancel=unsupported` 时客户端只做本地取消，不调用本 RPC。
  //
  // 授权：已认证且调用者对该任务所属画布有 `canvas.write`。
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
}

// GetCapabilities 请求。无参数：答案只取决于部署与协议版本，与调用者是谁无关。
message GetCapabilitiesRequest {}

// 一次协商需要的全部信息。客户端应先用它决定是否继续使用本服务。
message GetCapabilitiesResponse {
  // 协议版本。当前为 1；客户端内置同一个常量，不相等即保持休眠（不是故障）。
  uint32 protocol_version = 1;
  // 能力标识，稳定小写字符串。v1 必须包含 `catalog`（客户端据此决定是否拉目录）；
  // 其余取值（例如 `cancel`、`idempotency`）客户端可以忽略，未知值不得导致失败。
  repeated string features = 2;
  // 建议的轮询间隔（毫秒）。客户端可在自己的下限与该值之间自适应；0 取客户端默认值。
  uint32 poll_after_ms = 3;
  // 部署级限额。字段为 0 表示"服务端未公布"，客户端按自己的本地上限处理。
  CapabilityLimits limits = 4;
  // 本部署可执行的模型类型（小写：language|image|video|audio）。
  repeated string model_types = 5;
  // 支持的取消范围（小写：local|remote）。模型级 `cancel` 的取值必须落在其中。
  repeated string cancel_scopes = 6;
}

// 部署级限额。所有字段都是"服务端愿意接受的上限"，不是客户端必须触及的目标。
message CapabilityLimits {
  // prompt 最大字符数。
  uint32 prompt_max_chars = 1;
  // 单次提交最多的参考输入条数。
  uint32 max_inputs = 2;
  // `parameters` 序列化后允许的最大字节数。
  uint64 max_parameter_bytes = 3;
  // 文本结果最大字符数；超出时服务端截断并置 `TextOutput.truncated`。
  uint64 max_text_output_chars = 4;
  // 单个图片结果对象的最大字节数。
  uint64 max_image_output_bytes = 5;
  // 单个音频结果对象的最大字节数。
  uint64 max_audio_output_bytes = 6;
  // 单个视频结果对象的最大字节数。
  uint64 max_video_output_bytes = 7;
  // 幂等键保留期（秒）。必须覆盖客户端重启补提窗口；过期后同 key 重提会被当成新提交。
  uint64 idempotency_retention_seconds = 8;
}

// GetCatalog 请求。无参数：目录是部署级的，不随画布变化。
message GetCatalogRequest {}

// 服务端权威模型目录。客户端从这里构造模型清单，不按名称推断能力。
message GetCatalogResponse {
  // 本部署是否提供托管生成。false 时 `models` 为空且 `reason` 给出稳定原因；
  // 客户端应保持休眠（不注册 Provider），而不是把它当错误。
  bool available = 1;
  // `available=false` 时的稳定小写原因码（例如 `not-configured`）。可展示，但客户端对
  // 未知值必须回落到本地文案；不得含地址、密钥与内部细节。
  string reason = 2;
  // 目录版本，单调递增。只用于判断"目录变了、需要重新取"，不是数据事实源。
  uint64 catalog_revision = 3;
  // 各模型类型下的默认模型（按 `model_key` 引用）。客户端用于预填默认选择；
  // 引用不存在或不可执行的模型时忽略该项。
  repeated DefaultModel default_models = 4;
  // 目录中的模型。客户端逐条校验，形状非法或类型未知时只跳过该条，不影响其它模型。
  repeated GenerationModel models = 5;
}

// 某模型类型下的默认模型引用。
message DefaultModel {
  // 模型类型（小写：language|image|video|audio）。
  string model_type = 1;
  // `GenerationModel.model_key`。
  string model_key = 2;
}

// 一个可执行模型的完整描述。字段全部由服务端权威给出；客户端不得按模型名补齐能力。
//
// 目录条目必须自足：缺少客户端必需事实的条目由客户端跳过，不影响其它条目。
message GenerationModel {
  // 目录内稳定、不透明的模型键，只允许 `[A-Za-z0-9._-]` 且不含 `:`。
  // 提交时原样回填到 `SubmitTask.model_key`；客户端不得解析它推断 provider 或上游模型。
  string model_key = 1;
  // 服务端内部上游 provider 的稳定标识。只用于展示与诊断，不参与客户端路由。
  string provider_id = 2;
  // 上游模型 id。只用于展示与诊断；客户端不得据此推断能力。
  string provider_model_id = 3;
  // 模型类型，小写：language|image|video|audio。客户端只接受这四个值，其余跳过该模型。
  string model_type = 4;
  // 展示标题。不含地址、密钥与内部代号。
  string title = 5;
  // 参数 JSON Schema（受控方言）。客户端只投影它能理解的形状，未知关键字忽略。
  google.protobuf.Struct input_schema = 6;
  // 默认参数，与 `input_schema` 同方言；客户端用于预填。
  google.protobuf.Struct default_input = 7;
  // 参考输入的具名 binding；缺省表示该模型不接受参考输入。
  repeated InputBinding bindings = 8;
  // prompt 要求，小写：required|optional|none；缺省按 `required`。
  string prompt_requirement = 9;
  // 取消能力，小写：local|remote|unsupported；缺省按 `local`。
  string cancel = 10;
  // 服务端把任务推进到终态的时间预算（毫秒）。客户端只用于展示与诊断，不据此判定失败：
  // 任务终态以服务端状态为准。
  uint32 task_timeout_ms = 11;
  // 交互 identity；缺省按 `generic-model@1`。客户端未注册的 `{id,version}` 归一 generic。
  ModelInteraction interaction = 12;
  // 模型事实能力。未知键必须忽略；缺省 = 未声明（消费者按不支持处理）。
  google.protobuf.Struct capability_facts = 13;
  // 能力摘要（`operation` 等展示用事实）；未知键忽略，不含秘密。
  google.protobuf.Struct capabilities = 14;
  // 该模型当前能否执行。false 时不出现在可提交目录，`unavailable_reason` 给出原因。
  // 用 proto3 optional 保留 presence：ProtoJSON 会省略普通 bool 的 false，客户端就分不清
  // 「服务端没声明」与「明确不可执行」。缺省（未声明）按可执行处理。
  optional bool executable = 15;
  // `executable=false` 时的可展示稳定短语（不含地址与密钥）。
  string unavailable_reason = 16;
  // 运行配置的 schema 版本；提交时回填到 `Admission.schema_revision`。
  // 0 表示未声明，此时客户端不校验该维度。
  uint64 schema_revision = 17;
  // 不可变配置版本；提交时回填到 `Admission.config_version`。0 表示未声明。
  uint64 config_version = 18;
}

// 一个具名参考输入 binding：描述某个参数字段接受哪些媒体、角色与格式。
// 客户端按 binding 校验并编译参考输入；模型没有 bindings 即不接受参考输入。
message InputBinding {
  // `input_schema` 中的字段名（参数名）。
  string field = 1;
  // 语义，小写：reference-image|reference-video|reference-audio。
  string semantic = 2;
  // 允许的 role 取值（客户端按 role 归类素材）。
  repeated string roles = 3;
  // 允许的媒体类别，小写：image|video|audio。
  repeated string media_kinds = 4;
  // 允许的 MIME 类型；空表示不限制。
  repeated string media_types = 5;
  // 该字段最多接受的条数；0 表示服务端未声明，客户端按本地上限。
  uint32 max_items = 6;
  // 值格式，小写：url|reference。远端提交一律是 `reference`：只传稳定引用身份。
  string value_format = 7;
}

// 交互 identity（客户端本地 Registry 的非执行 identity）。缺省 generic-model@1。
message ModelInteraction {
  // identity 名，小写，例如 `generic-model`。
  string id = 1;
  // identity 版本。
  uint32 version = 2;
}

// 一个参考输入的稳定身份。只含稳定引用，不含 URL 与字节。
message TaskInput {
  // 稳定的素材 id（客户端画布素材标识）。
  string asset_id = 1;
  // 素材在该模型 binding 中的角色。
  string role = 2;
  // 稳定对象键：服务端能按 `(canvas_id, storage_key)` 读到的对象。
  // 客户端不得自行拼接或猜测服务端的物理键。
  string storage_key = 3;
  // MIME 类型。
  string media_type = 4;
  // 媒体类别，小写：image|video|audio。缺省时服务端按 `media_type` 推断。
  string media_kind = 5;
}

// 受理版本：客户端用提交时看到的目录版本固定"这次提交基于哪份模型描述"。
// 三个字段都为 0 表示该维度未声明（客户端拿不到该版本），服务端不得把缺省当不匹配。
message Admission {
  // 提交时看到的 `GetCatalog.catalog_revision`。不匹配时以 `catalog-changed` 拒绝受理。
  uint64 catalog_revision = 1;
  // `GenerationModel.schema_revision`。
  uint64 schema_revision = 2;
  // `GenerationModel.config_version`。
  uint64 config_version = 3;
}

// 提交请求。只携带稳定引用与已校验参数，不携带 URL、字节或凭据。
message SubmitTaskRequest {
  // 提交幂等键：客户端稳定的 `workerTaskKey`。
  //
  // 同 key 同 payload 返回首次受理的任务（`reused=true`，不重复创建上游任务）；同 key
  // 不同 payload MUST NOT 创建第二个任务，MUST 以稳定码 `key-reused` 收敛。保留期见
  // `GetCapabilities.limits.idempotency_retention_seconds`；客户端只在传输层未确认时
  // 重试，且重试必须带同一个 key。
  string idempotency_key = 1;
  // 任务所属画布。必填；服务端按它判 `canvas.write`，并决定结果对象的作用域。
  // 画布尚未同步到服务端时以稳定码 `canvas-not-shared` 失败，不创建上游任务。
  string canvas_id = 2;
  // `GetCatalog` 返回的模型键；未知或已下线的模型以 `catalog-changed` 失败。
  string model_key = 3;
  // 模型类型，小写。必须与 `model_key` 对应，否则 invalid_argument。
  string model_type = 4;
  // 提示词；是否必填由模型 `prompt_requirement` 决定。
  string prompt = 5;
  // 已按 `input_schema` 校验的参数。
  google.protobuf.Struct parameters = 6;
  // 稳定参考输入；顺序与模型 binding 的编译顺序一致。
  repeated TaskInput inputs = 7;
  // 客户端为这次执行选定的交互 identity；缺省 generic-model@1。
  ModelInteraction interaction = 8;
  // 受理版本。
  Admission admission = 9;
  // 客户端画布节点 id；只用于诊断与关联，不参与授权。
  string node_id = 10;
  // 客户端一次画布运行的 id；只用于诊断与关联，不参与授权。
  string run_id = 11;
}

// 受理结果。提交不等待终态：这里只给出任务身份与"是否复用了既有任务"。
message SubmitTaskResponse {
  // 任务号。无论本次是否新建，客户端都把它写进执行句柄，并只用它轮询。
  string task_id = 1;
  // 任务当前状态。首次受理通常是 `TASK_STATE_QUEUED`；被稳定拒绝的受理以
  // `TASK_STATE_FAILED` 返回，稳定码经 `GetTask` 的 `TaskFailure.code` 读取。
  TaskState state = 2;
  // true 表示该幂等键此前已受理，本次没有创建新任务（同 key 同 payload 的正常重放）。
  bool reused = 3;
  // 回显幂等键，便于客户端确认"这个任务号属于哪个 key"。
  string idempotency_key = 4;
}

// 读取任务的引用：`task_id` 与 `idempotency_key` 二选一，且必须恰好给一个。
message GetTaskRequest {
  oneof reference {
    // 提交时返回的任务号。
    string task_id = 1;
    // 提交时使用的幂等键。查到的是该 key 首次受理的任务。
    string idempotency_key = 2;
  }
}

// 任务的状态、进度、结果与稳定错误。进行中只带状态与进度，终态才带 `result` 或 `error`。
message GetTaskResponse {
  // 任务号。
  string task_id = 1;
  // 该任务的幂等键；便于恢复时确认身份。
  string idempotency_key = 2;
  // 任务状态。`TASK_STATE_UNSPECIFIED` 说明服务端实现有缺陷，客户端按失败处理。
  TaskState state = 3;
  // 进度，0..1 的小数（成功终态为 1）。只用于展示；单调不减，未知时为 0。
  double progress = 4;
  // 上游任务 id（不透明的稳定诊断标识）；没有时为空。客户端不得用它直连上游。
  string upstream_task_id = 5;
  // 成功终态的结果。进行中为空。
  oneof result {
    // 文本结果。
    TextOutput text = 6;
    // 媒体结果（稳定对象引用与 metadata，不含签名地址）。
    MediaOutput media = 7;
  }
  // 失败终态的稳定错误；只在 `TASK_STATE_FAILED` 时有值。
  TaskFailure error = 8;
  // 时间线；未到达的时刻为空字符串。
  TaskTiming timing = 9;
  // 记录修订号，单调递增（uint64 在 ProtoJSON 中是字符串）。客户端只在它前进时更新本地视图。
  uint64 record_revision = 10;
  // 最近一次变化时刻，RFC 3339 UTC。
  string updated_at = 11;
}

// 文本结果。
message TextOutput {
  // 文本正文。只含生成结果，不含上游原始响应。
  string text = 1;
  // 服务端是否因 `limits.max_text_output_chars` 截断了正文。
  bool truncated = 2;
}

// 媒体结果。只有稳定对象的身份与 metadata：没有签名地址，也没有字节。
message MediaOutput {
  // 媒体类别，小写：text|image|video|audio。
  string media_kind = 1;
  // 稳定对象键（客户端媒体逻辑键空间，按画布作用域可读）。
  string storage_key = 2;
  // MIME 类型。
  string content_type = 3;
  // 对象字节数。
  uint64 size = 4;
  // 内容校验和（用于一致性校验，不是授权凭据）。
  string checksum = 5;
  // 时长（秒），只对音视频有意义；未知为 0。
  double duration_seconds = 6;
  // 可选封面/海报（视频常用）。
  MediaPoster poster = 7;
}

// 媒体封面/海报的稳定对象引用。
message MediaPoster {
  // 稳定对象键。
  string storage_key = 1;
  // MIME 类型。
  string content_type = 2;
  // 对象字节数。
  uint64 size = 3;
  // 内容校验和。
  string checksum = 4;
}

// 稳定的任务失败。业务失败只走这里，不走 RPC 错误。
message TaskFailure {
  // 稳定小写码，与客户端既有稳定码表同字面量：
  // `catalog-changed` / `key-reused` / `canvas-not-shared` / `limit-exceeded` /
  // `resource-exhausted` / `media-not-found` / `unsupported` / `unavailable` /
  // `storage-failed`。未知码必须按"不可重试失败"处理。
  string code = 1;
  // 可展示、已脱敏的固定短语。客户端优先按 `code` 出本地文案；不得透传上游正文。
  string message = 2;
  // 是否值得重试（服务端判断，例如 `unavailable` / `storage-failed`）。
  bool retryable = 3;
  // 上游 HTTP 状态码（有上游时）；0 表示无。
  uint32 upstream_status = 4;
  // 上游稳定错误码（已脱敏）；空表示无。
  string upstream_code = 5;
}

// 任务时间线。字符串均为 RFC 3339 UTC；未到达的时刻为空字符串。
message TaskTiming {
  // 受理时刻。
  string admitted_at = 1;
  // 首次开始执行的时刻。
  string started_at = 2;
  // 进入终态的时刻。
  string finished_at = 3;
  // 最近一次状态变化的时刻。
  string state_changed_at = 4;
}

// 取消请求。
message CancelTaskRequest {
  // 要取消的任务号（`SubmitTask` 返回的 `task_id`）。
  string task_id = 1;
}

// 取消结果。取消是幂等的：任务已是终态时返回当前终态，不再改变。
message CancelTaskResponse {
  // 任务号。
  string task_id = 1;
  // 取消后的任务状态。取消已受理但终态尚未收敛时，可以是进行中状态。
  TaskState state = 2;
  // 本次取消实际作用的范围，小写：remote|local|unsupported。
  // `remote` = 已向上游请求取消；`local` = 只在服务端侧收敛；`unsupported` = 该模型
  // 不支持取消，状态不变。声明 `cancel=unsupported` 的模型客户端只做本地取消，不调用本 RPC。
  string cancel_scope = 3;
}

// 任务状态机。客户端必须穷举；`TASK_STATE_UNSPECIFIED` 视为失败。
//
// 流转：UNSPECIFIED → QUEUED → PENDING → RUNNING → SUCCEEDED|FAILED|CANCELLED。
// 终态只有后三个；终态不再变化（重放、重复取消都返回同一终态）。
enum TaskState {
  // 未设置。服务端实现缺陷，客户端按失败处理。
  TASK_STATE_UNSPECIFIED = 0;
  // 已持久化受理，等待调度；此时取消是可靠的。
  TASK_STATE_QUEUED = 1;
  // 已交给上游、等待上游开始执行；取消可能已经来不及。
  TASK_STATE_PENDING = 2;
  // 上游执行中。
  TASK_STATE_RUNNING = 3;
  // 成功终态；`result` 有值。
  TASK_STATE_SUCCEEDED = 4;
  // 失败终态；`error` 有值。
  TASK_STATE_FAILED = 5;
  // 取消终态。
  TASK_STATE_CANCELLED = 6;
}
