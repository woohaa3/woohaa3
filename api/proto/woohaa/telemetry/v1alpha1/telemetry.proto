syntax = "proto3";

package woohaa.telemetry.v1alpha1;

import "google/protobuf/timestamp.proto";

option go_package = "woohaa3/api/gen/go/woohaa/telemetry/v1alpha1;telemetryv1alpha1";

// Local client diagnostics, not product analytics; do not duplicate completed RPCs.
// Events are independent of operational traces and metrics.
// Authentication is required, including in development mode. No arbitrary
// properties, payloads, tokens, resource names or client-supplied actor IDs.
enum Action {
  ACTION_UNSPECIFIED = 0;
  ACTION_CANVAS_OPEN = 1;
  ACTION_CANVAS_SAVE = 2;
  ACTION_EDITOR_EDIT = 3;
  ACTION_SYNC_CONNECT = 4;
  ACTION_SYNC_RECONCILE = 5;
  ACTION_LOCAL_VALIDATION = 6;
}

enum Result {
  RESULT_UNSPECIFIED = 0;
  RESULT_SUCCESS = 1;
  RESULT_FAILURE = 2;
  RESULT_CANCELLED = 3;
  RESULT_REJECTED = 4;
}

enum Client {
  CLIENT_UNSPECIFIED = 0;
  CLIENT_BROWSER = 1;
  CLIENT_DESKTOP = 2;
  CLIENT_LOCAL_HOST = 3;
}

enum Surface {
  SURFACE_UNSPECIFIED = 0;
  SURFACE_CANVAS = 1;
  SURFACE_EDITOR = 2;
  SURFACE_SYNC = 3;
  SURFACE_LOCAL_VALIDATION = 4;
}

message ClientEvent {
  Action action = 1;
  Result result = 2;
  Client client = 3;
  Surface surface = 4;
  // Optional correlation: exactly 32 lowercase hex digits, nonzero.
  // Invalid values are discarded; never contains arbitrary text.
  string trace_id = 5;
  // Reporter's own frontend build version, injected at build time (for example
  // "v1.4.2" or "v1.4.2-3-gabc1234-dirty"); empty when the reporter has none.
  // Shape-checked, not authenticated: at most 64 characters of [0-9A-Za-z.+_-]
  // starting with an alphanumeric. Invalid values are discarded, never rejected,
  // and the value is never arbitrary text, a commit hash list or a resource name.
  string frontend_version = 6;
}

message ReportEventsRequest {
  // At most 100 events, 16 KiB per request. Invalid enums reject the batch.
  repeated ClientEvent events = 1;
}

message ReportEventsResponse {
  uint32 accepted_count = 1;
}

message StoredEvent {
  int64 id = 1;
  // Derived exclusively from the authenticated server context.
  string actor_id = 2;
  google.protobuf.Timestamp received_at = 3;
  ClientEvent event = 4;
}

message ListEventsRequest {
  // Defaults to 50, maximum 200.
  int32 page_size = 1;
  // Opaque cursor returned by the preceding page.
  string page_token = 2;
}

message ListEventsResponse {
  // Newest first. Expired events are excluded.
  repeated StoredEvent events = 1;
  string next_page_token = 2;
}

service TelemetryService {
  rpc ReportEvents(ReportEventsRequest) returns (ReportEventsResponse);
}

// Requires server-side administrative authorization.
service TelemetryAdminService {
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}
