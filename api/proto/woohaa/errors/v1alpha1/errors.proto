syntax = "proto3";

package woohaa.errors.v1alpha1;

import "google/protobuf/descriptor.proto";

option go_package = "woohaa3/api/gen/go/woohaa/errors/v1alpha1;errorsv1alpha1";

// FailureDetail 是挂在 Connect 错误详情里的失败原因。
//
// 服务端把 code / reason / message 都记在错误值本身（api/errs.Error），
// 这里只把其中**客户端需要分支**的部分搬上线。客户端按 reason 分支，不得匹配 message。
message FailureDetail {
  // 稳定业务码，点分命名：canvas.not_found。
  string reason = 1;

  // 面向用户的说明，与服务端分发的文案同源。
  string message = 2;

  // 结构化补充：canvas_id、field、retryable 等。
  map<string, string> metadata = 3;
}

// 分类上的选项：编译期由 api/tools/generrors 读出来生成本语言的错误值。
extend google.protobuf.EnumValueOptions {
  // 用户可见文案。
  string text = 50001;
  // Connect/gRPC 传输码（not_found / failed_precondition / ...）。
  string connect_code = 50002;
}

// FailureReason 是失败分类的唯一来源。
//
