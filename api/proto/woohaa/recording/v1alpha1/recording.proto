syntax = "proto3";

package woohaa.recording.v1alpha1;

option go_package = "woohaa3/api/gen/go/woohaa/recording/v1alpha1;recordingv1alpha1";

// Local recording executor control plane (unstable).
//
// This is NOT a network service: the local host owns a per-checkout user-private
// Unix-domain socket and the desktop supervisor connects to it. Messages here are
// the single source for that boundary; consumers use the generated bindings or a
// serde projection of the protobuf JSON form. Do not define a second schema.
//
// Identity rule: every event, resource chunk and acknowledgement carries the full
// JobIdentity. A frame or artifact that cannot be matched against the executor's
// current (job, attempt, epoch) is rejected, never merged.
//
// Size rule: control messages stay within 8 MiB. Media and artifacts always travel
// as bounded chunks of at most 1 MiB; never inline RGBA arrays or whole videos.

// Wire protocol revisions. A peer must reject a version it does not implement
// before accepting any job.
enum RecordingProtocolVersion {
  RECORDING_PROTOCOL_VERSION_UNSPECIFIED = 0;
  RECORDING_PROTOCOL_VERSION_1_ALPHA_1 = 1;
}

// Why a recording exists. Reference recordings are cacheable and may become stale;
// explicit exports keep the version frozen at submit time.
enum RecordingPurpose {
  RECORDING_PURPOSE_UNSPECIFIED = 0;
  RECORDING_PURPOSE_REFERENCE = 1;
  RECORDING_PURPOSE_EXPORT = 2;
}

// Host-visible lifecycle. `encoding` covers the final drain/mux after rendering.
enum RecordingJobState {
  RECORDING_JOB_STATE_UNSPECIFIED = 0;
  RECORDING_JOB_STATE_QUEUED = 1;
  RECORDING_JOB_STATE_PREPARING = 2;
  RECORDING_JOB_STATE_RENDERING = 3;
  RECORDING_JOB_STATE_PAUSED = 4;
  RECORDING_JOB_STATE_ENCODING = 5;
  RECORDING_JOB_STATE_UPLOADING = 6;
  RECORDING_JOB_STATE_COMMITTING = 7;
  RECORDING_JOB_STATE_SUCCEEDED = 8;
  RECORDING_JOB_STATE_CANCELLED = 9;
  RECORDING_JOB_STATE_FAILED = 10;
  RECORDING_JOB_STATE_STALE = 11;
}

// Scheduling class. Higher priority wins; reference recordings pause between
// frame barriers and never block interaction, visible playback or captures.
enum RecordingPriority {
  RECORDING_PRIORITY_UNSPECIFIED = 0;
  RECORDING_PRIORITY_REFERENCE = 1;
  RECORDING_PRIORITY_EXPORT = 2;
  RECORDING_PRIORITY_INTERACTIVE = 3;
}

// Failure stage. The stage identifies where work stopped so the UI can distinguish
// a real readiness timeout from "executor missing" or "encode unsupported".
enum RecordingErrorStage {
  RECORDING_ERROR_STAGE_UNSPECIFIED = 0;
  RECORDING_ERROR_STAGE_CAPABILITY = 1;
  RECORDING_ERROR_STAGE_COMPILE = 2;
  RECORDING_ERROR_STAGE_RESOURCE_FETCH = 3;
  RECORDING_ERROR_STAGE_DECODE = 4;
  RECORDING_ERROR_STAGE_FRAME_READY = 5;
  RECORDING_ERROR_STAGE_READBACK = 6;
  RECORDING_ERROR_STAGE_ENCODE = 7;
  RECORDING_ERROR_STAGE_MUX = 8;
  RECORDING_ERROR_STAGE_UPLOAD = 9;
  RECORDING_ERROR_STAGE_COMMIT = 10;
  RECORDING_ERROR_STAGE_EXECUTOR_LOST = 11;
}

// Output container. Reference and export recordings currently use MP4/H.264 only;
// other containers must be added explicitly rather than renaming a WebM payload.
enum RecordingContainer {
  RECORDING_CONTAINER_UNSPECIFIED = 0;
  RECORDING_CONTAINER_MP4 = 1;
}

enum RecordingVideoCodec {
  RECORDING_VIDEO_CODEC_UNSPECIFIED = 0;
  RECORDING_VIDEO_CODEC_H264 = 1;
}

// Complete identity of one recording attempt. `snapshot_hash` covers the canonical
// serialized snapshot; `content_identity` covers the business visual content;
// `profile_key` covers renderer/compiler/codec/colour revisions plus size and rate.
message JobIdentity {
  string job_id = 1;
  string attempt_id = 2;
  string executor_instance_id = 3;
  // Monotonic per executor; bumped when the executor restarts or its device is lost.
  uint64 execution_epoch = 4;
  string snapshot_hash = 5;
  string content_identity = 6;
  string profile_key = 7;
}

// Exact rational sample clock. Duration is `duration_numer / duration_denom`
// seconds; frame rate is `frame_rate_numer / frame_rate_denom`.
// For N = ceil(D * F) frames, frame i has PTS = i / F and duration
// min(1 / F, D - i / F); the last frame samples T = D.
message RecordingTiming {
  uint32 frame_rate_numer = 1;
  uint32 frame_rate_denom = 2;
  uint64 duration_numer = 3;
  uint64 duration_denom = 4;
}

message RecordingProfile {
  string profile_key = 1;
  RecordingContainer container = 2;
  RecordingVideoCodec codec = 3;
  uint32 width = 4;
  uint32 height = 5;
  uint32 bitrate = 6;
  bool fast_start = 7;
  bool include_audio = 8;
  // Renderer/compiler/codec/colour revisions folded into `profile_key`.
  string renderer_version = 9;
  string compiler_version = 10;
  string codec_version = 11;
  string color_revision = 12;
}

// Authority the snapshot was frozen from. Later edits do not change a running job.
message RecordingOrigin {
  string canvas_id = 1;
  string node_id = 2;
  string clip_id = 3;
  string source_identity = 4;
  uint64 canvas_revision = 5;
  // Filled by the host at submit time from the committed source node.
  string source_incarnation = 6;
}

// Media the worker must decode. `checksum` and `content_type` are authoritative;
// the worker writes a private read-only copy and verifies the hash before use.
message ResourceDescriptor {
  string resource_id = 1;
  string storage_key = 2;
  // 64-bit hex checksum as stored by the media service.
  string checksum = 3;
  string content_type = 4;
  uint64 size_bytes = 5;
  // Local playback mapping for this clip, mirroring the visible-playback rules.
  double start_time = 6;
  double time_scale = 7;
  bool looped = 8;
  double end_time = 9;
  double media_duration = 10;
}

// Compiled, self-contained recording input. The worker never executes JavaScript
// and never resolves arbitrary paths; `scene_ir_json` and `motion_json` are the
// outputs of the film-set compiler and are tagged by their schema versions.
message RecordingSnapshot {
  string schema_version = 1;
  string compiler_version = 2;
  string renderer_version = 3;
  RecordingOrigin origin = 4;
  RecordingProfile profile = 5;
  RecordingTiming timing = 6;
  // Canonical `woohaa-model-scene-ir-v2` document (UTF-8 JSON object).
  bytes scene_ir_json = 7;
  // Canonical compiled motion/camera tracks (UTF-8 JSON object).
  bytes motion_json = 8;
  // Initial camera; mirrors the compiled `initialCamera` entry.
  RecordingCamera initial_camera = 9;
  // `16:9`, `9:16`, ... ; also encoded in the profile size.
  string aspect = 10;
  repeated ResourceDescriptor resources = 11;
}

message RecordingCamera {
  double azimuth = 1;
  double elevation = 2;
  double distance = 3;
  double focus_offset_x = 4;
  double focus_offset_y = 5;
  double focus_offset_z = 6;
}

// What a trusted local executor can actually do on this machine.
message ExecutorCapability {
  string executor_instance_id = 1;
  string protocol_version = 2;
  repeated RecordingProtocolVersion supported_protocol_versions = 3;
  string snapshot_schema_version = 4;
  string renderer_version = 5;
  string compiler_version = 6;
  string codec_version = 7;
  string color_revision = 8;
  // Empty when no hardware adapter is available; software adapters MUST set
  // `software_adapter` so the host can refuse rendering acceptance.
  string gpu_adapter = 9;
  string gpu_backend = 10;
  bool software_adapter = 11;
  repeated string video_decoders = 12;
  repeated string video_encoders = 13;
  bool hardware_encoding = 14;
  uint64 max_resource_chunk_bytes = 15;
  uint64 max_concurrent_jobs = 16;
  uint64 max_queued_jobs = 17;
  uint64 max_snapshot_bytes = 18;
  uint64 max_artifact_bytes = 19;
  string checkout_id = 20;
}

message CapabilityRequest {
  uint64 sequence = 1;
  string request_id = 2;
  string protocol_version = 3;
  // Nonce handed to the supervisor through trusted launch configuration.
  string registration_nonce = 4;
}

message CapabilityResponse {
  uint64 sequence = 1;
  string request_id = 2;
  bool accepted = 3;
  ExecutorCapability capability = 4;
  RecordingError error = 5;
}

message SubmitJobRequest {
  uint64 sequence = 1;
  string request_id = 2;
  RecordingPurpose purpose = 3;
  RecordingPriority priority = 4;
  JobIdentity job = 5;
  RecordingSnapshot snapshot = 6;
  // Lease the executor must respect; it stops work when the host stops renewing.
  uint64 lease_ms = 7;
}

message SubmitJobResponse {
  uint64 sequence = 1;
  string request_id = 2;
  JobIdentity job = 3;
  RecordingJobState state = 4;
  bool accepted = 5;
  RecordingError error = 6;
}

message GetJobRequest {
  uint64 sequence = 1;
  string request_id = 2;
  JobIdentity job = 3;
}

message ListJobsRequest {
  uint64 sequence = 1;
  string request_id = 2;
  // Empty returns every job known to the executor.
  string canvas_id = 3;
}

message JobSummary {
  JobIdentity job = 1;
  RecordingPurpose purpose = 2;
  RecordingJobState state = 3;
  uint32 completed_frames = 4;
  uint32 total_frames = 5;
  RecordingError error = 6;
}

message JobListResponse {
  uint64 sequence = 1;
  string request_id = 2;
  repeated JobSummary jobs = 3;
}

// Cancellation is linearized against `committing`. A job already committing
// answers `too_late` and the caller must wait for the real commit result.
message CancelJobRequest {
  uint64 sequence = 1;
  string request_id = 2;
  JobIdentity job = 3;
  string reason = 4;
}

message CancelJobResponse {
  uint64 sequence = 1;
  string request_id = 2;
  JobIdentity job = 3;
  bool cancelled = 4;
  bool too_late = 5;
  RecordingJobState state = 6;
}

// Scheduling hint from the host: pause before the next frame barrier, or resume.
message PauseJobRequest {
  uint64 sequence = 1;
  string request_id = 2;
  JobIdentity job = 3;
  string reason = 4;
}

message ResumeJobRequest {
  uint64 sequence = 1;
  string request_id = 2;
  JobIdentity job = 3;
}

message JobControlResponse {
  uint64 sequence = 1;
  string request_id = 2;
  JobIdentity job = 3;
  RecordingJobState state = 4;
  bool applied = 5;
  RecordingError error = 6;
}

// Executor -> host heartbeat. Missing heartbeats let the host expire the lease;
// the executor also stops itself when the host stops renewing.
message LeaseHeartbeat {
  uint64 sequence = 1;
  JobIdentity job = 2;
  RecordingJobState state = 3;
  uint64 lease_remaining_ms = 4;
  // Executor lease when no job is active; job is omitted in that case.
  string executor_instance_id = 5;
}

// Host -> executor lease renewal.
message LeaseRenewal {
  uint64 sequence = 1;
  JobIdentity job = 2;
  uint64 lease_ms = 3;
  // Executor lease when no job is active.
  string executor_instance_id = 4;
}

message RecordingProgress {
  uint64 sequence = 1;
  JobIdentity job = 2;
  RecordingJobState state = 3;
  uint32 completed_frames = 4;
  uint32 total_frames = 5;
  // Sample time of the frame being prepared, in seconds from clip start.
  double sample_time = 6;
}

// Per-frame diagnostic. Carries the real failing stage instead of a generic timeout.
message FrameDiagnostic {
  uint64 sequence = 1;
  JobIdentity job = 2;
  uint32 frame_index = 3;
  double sample_time = 4;
  RecordingErrorStage stage = 5;
  string code = 6;
  string message = 7;
  // Object, resource or media id the diagnostic refers to (no media bytes).
  string subject_id = 8;
}

message RecordingError {
  RecordingErrorStage stage = 1;
  string code = 2;
  string message = 3;
  // Absent when the failure is job-level (capability, compile, upload, commit).
  uint32 frame_index = 4;
  double sample_time = 5;
  string subject_id = 6;
  bool transient = 7;
}

message RecordingStateChanged {
  uint64 sequence = 1;
  JobIdentity job = 2;
  RecordingJobState state = 3;
  RecordingError error = 4;
  RecordingArtifact artifact = 5;
}

// Host -> executor request for a verified artifact chunk.
message ArtifactChunkRequest {
  uint64 sequence = 1;
  string request_id = 2;
  JobIdentity job = 3;
  uint64 offset = 4;
  uint32 max_bytes = 5;
}

// Truth of a finished artifact, re-verified by the host from the actual bytes.
message RecordingArtifact {
  JobIdentity job = 1;
  string content_sha256 = 2;
  uint64 size_bytes = 3;
  RecordingContainer container = 4;
  RecordingVideoCodec codec = 5;
  uint32 width = 6;
  uint32 height = 7;
  uint64 frame_count = 8;
  uint64 duration_numer = 9;
  uint64 duration_denom = 10;
  string mime_type = 11;
  // Private local artifact path, re-verified by the host before upload.
  string path = 12;
}

message ArtifactChunk {
  uint64 sequence = 1;
  string request_id = 2;
  JobIdentity job = 3;
  uint64 offset = 4;
  bytes data = 5;
  bool last = 6;
  RecordingArtifact artifact = 7;
}

// One control message in either direction. Exactly one payload is set.
message ControlMessage {
  RecordingProtocolVersion protocol_version = 1;
  uint64 sequence = 2;
  oneof payload {
    CapabilityRequest capability_request = 10;
    CapabilityResponse capability_response = 11;
    SubmitJobRequest submit_job = 12;
    SubmitJobResponse submit_job_response = 13;
    GetJobRequest get_job = 14;
    ListJobsRequest list_jobs = 15;
    JobListResponse job_list = 16;
    CancelJobRequest cancel_job = 17;
    CancelJobResponse cancel_job_response = 18;
    PauseJobRequest pause_job = 19;
    ResumeJobRequest resume_job = 20;
    JobControlResponse job_control_response = 21;
    LeaseHeartbeat lease_heartbeat = 22;
    LeaseRenewal lease_renewal = 23;
    RecordingProgress progress = 24;
    FrameDiagnostic frame_diagnostic = 25;
    RecordingStateChanged state_changed = 26;
    ArtifactChunkRequest artifact_chunk_request = 27;
    ArtifactChunk artifact_chunk = 28;
  }
}

// Bounded input/resource stream. Every chunk must be within
// `ExecutorCapability.max_resource_chunk_bytes` and continue exactly at `offset`.
message ResourceChunk {
  JobIdentity job = 1;
  string resource_id = 2;
  uint64 offset = 3;
  bytes data = 4;
  bool last = 5;
}

// Executor acknowledgement for one received resource chunk.
message ResourceChunkAck {
  uint64 sequence = 1;
  JobIdentity job = 2;
  string resource_id = 3;
  uint64 offset = 4;
  uint32 received_bytes = 5;
  bool complete = 6;
  string checksum = 7;
  RecordingError error = 8;
}
