syntax = "proto3";

package woohaa.storage.v1;

import "google/protobuf/timestamp.proto";

option go_package = "woohaa3/api/gen/go/woohaa/storage/v1;storagev1";

// 托管存储的管理只读面。
//
// 它回答「这张画布有哪些对象、多大、最近有没有异常增长」，并为管理端提供只读的
// 浏览与预览。字节仍然只走既有签名地址与 /storage/objects/* 字节入口，本服务不
// 新增第二条字节通道。
//
// 授权：只对部署管理员开放；管理端只能签读，不能签写或删除。
service StorageAdminService {
  // 按前缀分页列举一张画布下的对象元数据（不返回字节）。
  rpc ListCanvasObjects(ListCanvasObjectsRequest) returns (ListCanvasObjectsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 按画布返回派生索引的用量；索引可能不完整，响应带最近重算时间。
  rpc GetCanvasStorageUsage(GetCanvasStorageUsageRequest) returns (GetCanvasStorageUsageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 重算一张画布的派生索引。有界、可断点续扫；只写索引，不删除对象字节。
  rpc ReconcileCanvasStorage(ReconcileCanvasStorageRequest) returns (ReconcileCanvasStorageResponse);

  // 为管理端预览/下载签一个短时 GET 地址。已删除画布拒绝。
  rpc CreateCanvasObjectUrl(CreateCanvasObjectUrlRequest) returns (CreateCanvasObjectUrlResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message StorageObject {
  // 画布内的相对键，例如 media/generation-outputs/<sha256>.png。
  string key = 1;
  uint64 size = 2;
  // 后端列举没有提供时为空（COS 形态）；界面显示「未上报」。
  string content_type = 3;
  google.protobuf.Timestamp modified_at = 4;
  // client / generation / unknown（来自索引；列举本身不带来源）。
  string source = 5;
}

message ListCanvasObjectsRequest {
  string canvas_id = 1;
  // 画布内相对前缀；空表示全部。不得含 ..、绝对路径或空段。
  string prefix = 2;
  // 缺省 100，上限 1000。
  int32 page_size = 3;
  // 不透明游标；空表示从头开始。
  string page_token = 4;
}

message ListCanvasObjectsResponse {
  repeated StorageObject objects = 1;
  string next_page_token = 2;
}

message GetCanvasStorageUsageRequest {
  string canvas_id = 1;
}

message StorageUsageGroup {
  // generation-outputs / media / other。
  string label = 1;
  uint64 object_count = 2;
  uint64 total_bytes = 3;
}

message GetCanvasStorageUsageResponse {
  uint64 object_count = 1;
  uint64 total_bytes = 2;
  repeated StorageUsageGroup groups = 3;
  // 最近一次重算完成时刻；未设置表示从未重算。
  google.protobuf.Timestamp reconciled_at = 4;
  // 最近一次重算是否完整走完。
  bool complete = 5;
}

message ReconcileCanvasStorageRequest {
  string canvas_id = 1;
  // true 表示丢弃断点从头部重新扫描；false 表示从上次断点继续。
  bool restart = 2;
  // 单次最多处理的对象数；0 取服务端默认（20000），上限 100000。
  uint32 max_objects = 3;
}

message ReconcileCanvasStorageResponse {
  uint64 scanned = 1;
  uint64 upserted = 2;
  uint64 deleted = 3;
  // 本轮是否已经扫完；false 表示还有断点可继续。
  bool complete = 4;
  // 完成后为最近一次完成时刻；未完成时为空。
  google.protobuf.Timestamp reconciled_at = 5;
}

message CreateCanvasObjectUrlRequest {
  string canvas_id = 1;
  string key = 2;
  // 0 取部署默认；超过上限时按上限收紧。
  uint32 expires_seconds = 3;
}

message CreateCanvasObjectUrlResponse {
  string url = 1;
  google.protobuf.Timestamp expires_at = 2;
}
