syntax = "proto3";

package woohaa.storage.v1;

option go_package = "woohaa3/api/gen/go/woohaa/storage/v1;storagev1";

// 对象字节的私有存储面（服务端托管存储）。
//
// 谁用它：开源客户端的 `server-storage` 存储后端插件。客户端 core 的存储扩展点把
// `bucket(namespace)` 的读写转成这里的调用，于是「媒体字节存在服务端」与「存在本机/COS」
// 是同一种后端，靠设置 `storage.primary` 选用。
//
// 两条硬约束：
//
//  1. **对象默认私有**。元数据与签名都要 Bearer 会话（非匿名主体）；字节本身的读取/写入
//     一律走**短时签名地址**，没有签名就无法访问。服务端可以自己代理字节（本地磁盘等），
//     也可以把地址签给 COS 直接下发——两种形状对客户端一致。
//  2. **服务端不解析字节**。键由客户端按 `<namespace>/<key>` 组织（media 用 `media/<key>`），
//     服务端只加自己的前缀并按内容原样存取；不做转码、不做类型嗅探。
//
// 对象键是内容寻址的 SHA-256 路径，但**不能**把「知道键」当成授权：签名与认证才是授权。
//
// 这一层只管字节。画布文档持久化有事务语义（`canvas.storage.*`），不并入这里。

// 一个对象的元数据。`exists` 为 false 时其余字段无意义。
message ObjectInfo {
  bool exists = 1;
  // 对象字节数（不是某种编码后的长度）。
  uint64 size = 2;
  // 写入时登记的 Content-Type；写入方没给时为空。
  string content_type = 3;
}

message HeadObjectRequest {
  // 相对键，形如 `media/<sha256>.png`；不得以 `/` 开头，不得含 `..` 段。
  string key = 1;
}

message HeadObjectResponse {
  ObjectInfo info = 1;
}

message DeleteObjectRequest {
  string key = 1;
}

message DeleteObjectResponse {
  // 键本来就不存在时同样返回成功（幂等）；调用方要的是「现在没有这个对象」。
}

// 签名地址允许的 HTTP 方法。
enum SignedUrlMethod {
  SIGNED_URL_METHOD_UNSPECIFIED = 0;
  // 读取对象：支持 `Range` 请求头。
  SIGNED_URL_METHOD_GET = 1;
  // 写入对象：`PUT` 整个对象，请求体就是字节本身。
  SIGNED_URL_METHOD_PUT = 2;
}

message CreateSignedUrlRequest {
  string key = 1;
  SignedUrlMethod method = 2;
  // 有效期秒数；0 取服务端默认值，超过服务端上限时按上限收紧。
  uint32 expires_seconds = 3;
  // `PUT` 时必填：签名会绑定这个 Content-Type，写入方必须原样发送。
  // `GET` 时忽略。
  string content_type = 4;
}

message CreateSignedUrlResponse {
  // 已签名的绝对或站内地址。有效期由服务端决定，客户端不得自行延长。
  string url = 1;
  // 失效时刻（Unix 秒），用于客户端提前换签名而不是等到失败。
  int64 expires_at = 2;
}

// 服务端托管存储的元数据与签名面。
//
// 字节**不**经此服务传输：`CreateSignedUrl` 签出的地址才是字节通道（服务端代理或 COS 直连）。
// 这样可以避免把大对象塞进一元 RPC，也让「私有读写」只有一条授权路径。
service StorageService {
  // 读取对象元数据。
  rpc HeadObject(HeadObjectRequest) returns (HeadObjectResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 删除对象；不存在也算成功。
  rpc DeleteObject(DeleteObjectRequest) returns (DeleteObjectResponse);

  // 签一个短时地址（读或写）。没有签名就访问不到字节。
  rpc CreateSignedUrl(CreateSignedUrlRequest) returns (CreateSignedUrlResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}
