syntax = "proto3";

package woohaa.diagnostics.v1alpha1;

import "google/protobuf/timestamp.proto";

option go_package = "woohaa3/api/gen/go/woohaa/diagnostics/v1alpha1;diagnosticsv1alpha1";

// Local client diagnostics, not product analytics.
//
// This is the write side of "the client saw something the server was not part
// of": connection probes, login/device-code phases, sync upstream transitions
// and redacted error phrases. It is deliberately narrower than a log upload:
// entries carry stable identifiers plus a short sanitized message, never
// credentials, request/response bodies, media bytes, resource names or
// free-form user content.
//
// Entries are best-effort: a rejected or unavailable endpoint must never turn
// into an editing or sync failure. The server derives the actor from the
// authenticated context and records the receive time itself.
enum Level {
  LEVEL_UNSPECIFIED = 0;
  LEVEL_DEBUG = 1;
  LEVEL_INFO = 2;
  LEVEL_WARN = 3;
  LEVEL_ERROR = 4;
}

// ClientDiagnosticEntry is one bounded, already-redacted client-side event.
message ClientDiagnosticEntry {
  // Capture time on the reporter. The server also records its own receive time.
  google.protobuf.Timestamp time = 1;
  Level level = 2;
  // Stable module identifier (for example "remote-server" or "canvas"),
  // at most 64 characters.
  string category = 3;
  // Stable event identifier (for example "remote-probe-ok"), at most 64
  // characters. Arbitrary text is not accepted.
  string event = 4;
  // Optional stable result/error code, at most 64 characters.
  string code = 5;
  // Optional sanitized explanation, at most 512 characters. Token-like and
  // query-string secrets are redacted by the reporter before it gets here.
  string message = 6;
  // Client-generated identity of this entry: a UUIDv4 string, assigned once
  // when the reporter records the event and never changed afterwards. It is
  // the idempotency key: the same entry reported again (retry, reload, double
  // click, two concurrent uploads) is stored at most once per actor. Empty
  // when the reporter cannot provide one, in which case the batch is accepted
  // without deduplication.
  string entry_id = 7;
  // Optional structured details that do not deserve their own proto field, for
  // example status=200, server=host:port, phase=probe or missing=url,token.
  //
  // Keys are stable identifiers: at most 32 characters of [a-z0-9._-] starting
  // with a lowercase letter. Values are sanitized single-line text of at most
  // 256 characters; token-like and query-string secrets are redacted by the
  // reporter before upload, and the server applies the same normalization it
  // applies to `message`. At most 16 pairs and 2048 bytes of JSON per entry.
  //
  // The server drops pairs that violate the shape and keeps the entry: these
  // are optional explanatory details, not stable identifiers. This field is
  // deliberately a bounded map, not a free-form payload: arbitrary JSON, media
  // bytes, credentials, resource names and user content stay out of it.
  map<string, string> attributes = 8;
}

message ReportDiagnosticsRequest {
  // Reporter's own frontend build version; empty when unknown. Shape-checked,
  // not authenticated: at most 64 characters of [0-9A-Za-z.+_-] starting with
  // an alphanumeric.
  string frontend_version = 1;
  // At most 200 entries and 32 KiB per request. Invalid identifiers reject the
  // batch; the server validates every field before storing it.
  repeated ClientDiagnosticEntry entries = 2;
}

message ReportDiagnosticsResponse {
  // Number of entries this call actually stored. Entries whose entry_id was
  // already stored are not counted, so a replayed batch reports 0. Note that
  // zero is the proto3 default and is therefore omitted from JSON responses:
  // a client must read a missing field as 0, not as "unknown".
  uint32 accepted_count = 1;
}

// Receives bounded client diagnostics reported by an authenticated client
// host. The host, not the browser, holds the session token; the browser only
// triggers the upload through the host's same-origin handler.
service ClientDiagnosticsService {
  rpc ReportDiagnostics(ReportDiagnosticsRequest) returns (ReportDiagnosticsResponse);
}

// One stored entry: the reported payload plus the facts the server derived
// itself (identity and receive time).
message StoredDiagnosticEntry {
  int64 id = 1;
  // Derived exclusively from the authenticated server context.
  string actor_id = 2;
  google.protobuf.Timestamp received_at = 3;
  ClientDiagnosticEntry entry = 4;
  // The frontend build version declared with the batch, empty when unknown.
  // Shape-checked only: it is not evidence of who reported the entry.
  string frontend_version = 5;
}

message ListDiagnosticsRequest {
  // Defaults to 50, maximum 200.
  int32 page_size = 1;
  // Opaque cursor returned by the preceding page.
  string page_token = 2;

  // The filters below are combined with AND; an empty/zero value means "no
  // restriction on this field". They never change the meaning of the cursor:
  // `page_token` is still "the id of the last row of the previous page", so a
  // caller must keep the same filters while paging. Filtering does not add
  // aggregation: the response is still a page plus a cursor, not a count.
  //
  // Exact match on the actor recorded from the authenticated context (not a
  // reporter-supplied identity). Empty means any actor.
  string actor_id = 3;
  // LEVEL_UNSPECIFIED means any level.
  Level level = 4;
  // Exact match on the stable module identifier.
  string category = 5;
  // Exact match on the stable event identifier.
  string event = 6;
  // Exact match on the optional result/error code.
  string code = 7;
  // Case-insensitive substring over the sanitized message, the identifiers
  // (category/event/code) and the textual form of `attributes`. At most 128
  // characters. Empty means no keyword.
  string query = 8;
  // Inclusive lower/upper bound on the server receive time. Zero timestamps
  // mean "unbounded" on that side.
  google.protobuf.Timestamp since = 9;
  google.protobuf.Timestamp until = 10;
  // Exact match on the reporter-declared build version. Empty means any.
  string frontend_version = 11;
}

message ListDiagnosticsResponse {
  // Newest first. Expired entries are excluded.
  repeated StoredDiagnosticEntry entries = 1;
  string next_page_token = 2;
}

// Reads diagnostics across all actors. Requires server-side administrative
// authorization. The read model is the retention window plus an opaque cursor:
// filters narrow that window, but there is still no aggregation or count — a
// page is a page, not a total. Cursors stay valid across filter changes only
// when the filters themselves stay the same.
service DiagnosticsAdminService {
  rpc ListDiagnostics(ListDiagnosticsRequest) returns (ListDiagnosticsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

