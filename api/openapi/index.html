t-supported":false}},"/woohaa.identity.v1alpha1.IdentityService/BindIdentity":{"post":{"tags":["woohaa.identity.v1alpha1.IdentityService"],"summary":"BindIdentity","description":"Bind another sign-in method to the calling subject.\n\n Credential shape mirrors Login: the caller proves control of the identity in\n the same two ways, but the result is a binding instead of a session.\n\n **Ownership is decided by the caller, never by the credential.** The request\n carries a credential proving \"I control this identity\"; the target subject is\n always the caller's current session. There is deliberately no shape that\n names another subject: if there were, anyone holding someone else's channel\n credential could attach it to their own account — or worse, attach their own\n identity to someone else's subject.\n\n If the identity already belongs to a different subject, binding is refused\n and the response does not reveal who owns it: revealing it would turn a\n failed bind into a probe for \"which subject is this channel\".\n\n把另一种登录方式绑到当前主体上。请求里的凭证只证明\"我控制这个身份\"，**目标主体永远是当前会话**——接口面上没有\"绑到某个主体\"的形状，否则任何持有他人渠道凭证的人都能把对方身份挂到自己名下，反过来则是直接提权。该身份已属于另一个主体时拒绝，且不透露属于谁（否则失败的绑定会变成\"这个渠道对应哪个主体\"的探测）。归属规则：未被持有则写入；已属于自己则幂等成功；属于一个\"空主体\"（仅此一条身份且无角色绑定）则认领并入；否则拒绝。\n\n仅使用 POST，不标记为无副作用方法。","operationId":"woohaa.identity.v1alpha1.IdentityService.BindIdentity","parameters":[{"name":"Connect-Protocol-Version","in":"header","required":true,"schema":{"$ref":"#/components/schemas/connect-protocol-version"}},{"name":"Connect-Timeout-Ms","in":"header","schema":{"$ref":"#/components/schemas/connect-timeout-header"}}],"requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/woohaa.identity.v1alpha1.BindIdentityRequest"}}},"required":true},"responses":{"200":{"description":"Success","content":{"application/json":{"schema":{"$ref":"#/components/schemas/woohaa.identity.v1alpha1.BindIdentityResponse"}}},"headers":{"X-Trace-ID":{"description":"服务端请求链路 ID。","schema":{"type":"s ":"StartDeviceLogin","description":"Start a device-code login.\n\n Public on purpose: the caller has no credential yet — that is exactly the\n situation this flow exists for. A client that cannot show a login page\n (a desktop app, a CLI, a daemon) starts one of these, shows the user code\n and verification URI to a human, and polls until that human approves it\n from a browser that is already signed in.\n\n The response carries two credentials of different kinds and one address:\n   - device_code: high entropy, held by the client, never typed by a human;\n   - user_code: short and human-readable, typed into the approval page;\n   - verification_uri: the approval page, deliberately WITHOUT the user\n     code embedded (see ApproveDeviceLogin).\n Neither code may be logged: one buys an approval, the other a session.\n\n发起一次设备码登录。公开，理由同 Login：调用方还没有会话，而这正是它存在的前提。返回设备码（客户端保管、不可人工输入）、短码（给人读与输入）、批准页地址（**不含短码**，短码必须由人手动输入——\"人比对客户端与页面\"是挡住\"客户端被登进他人账号\"的唯一防线）、建议轮询间隔与过期时刻。设备码与短码都不得记录：前者能换来一份会话，后者能换来一次批准。部署未配置对外地址时该方法整体缺席（未实现），而不是报\"设备码无效\"。\n\n仅使用 POST，不标记为无副作用方法。","operationId":"woohaa.identity.v1alpha1.IdentityService.StartDeviceLogin","parameters":[{"name":"Connect-Protocol-Version","in":"header","required":true,"schema":{"$ref":"#/components/schemas/connect-protocol-version"}},{"name":"Connect-Timeout-Ms","in":"header","schema":{"$ref":"#/components/schemas/connect-timeout-header"}}],"requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/woohaa.identity.v1alpha1.StartDeviceLoginRequest"}}},"required":true},"responses":{"200":{"description":"Success","content":{"application/json":{"schema":{"$ref":"#/components/schemas/woohaa.identity.v1alpha1.StartDeviceLoginResponse"}}},"headers":{"X-Trace-ID":{"description":"服务端请求链路 ID。","schema":{"type":"string","pattern":"^[0-9a-f]{32}$"}},"traceparent":{"description":"W3C TraceContext 响应链路上下文。","schema":{"type":"string"}}}},"400":{"description":"invalid_argument：请求或字段不合法。","content":{"application/json ired":["awareness"]},{"required":["hello"]},{"required":["title"]},{"required":["update"]}]}}],"properties":{"hello":{"allOf":[{"title":"hello"},{"$ref":"#/components/schemas/woohaa.canvas.v1.Hello"}]},"update":{"allOf":[{"title":"update"},{"$ref":"#/components/schemas/woohaa.canvas.v1.ClientUpdate"}]},"awareness":{"allOf":[{"title":"awareness"},{"$ref":"#/components/schemas/woohaa.canvas.v1.AwarenessUpdate"}]},"title":{"allOf":[{"title":"title","description":"画布标题（展示元数据）。客户端在标题变化后、以及每次同步完成后发送；\n 服务端只对可写连接应用，用于管理端展示可读名称（服务端不解析 Yjs）。"},{"$ref":"#/components/schemas/woohaa.canvas.v1.ClientTitle"}]}},"title":"ClientFrame","additionalProperties":false},"woohaa.canvas.v1.ClientInfo":{"type":"object","properties":{"name":{"type":"string","title":"name","description":"客户端产品名，例如 `woohaa3-host`、`woohaa3-web`。"},"version":{"type":"string","title":"version","description":"客户端版本，例如 `0.1.0` 或 `v1.4.2-3-gabc1234`。"},"platform":{"type":"string","title":"platform","description":"平台描述，例如 `darwin-arm64`、`browser`。"}},"title":"ClientInfo","additionalProperties":false,"description":"客户端在 Hello 里自报的展示元数据。\n\n 它**只用于观测与排障**（管理端画布调试通道的客户端描述），不参与鉴权、授权、同步\n 与任何判定：服务端把内容原样转给观测通道并截断超长值，绝不据此放行或拒绝任何动作。\n 这也是为什么它必须在 Hello 里声明，而不是走握手头：浏览器无法为 WebSocket 设置\n 自定义请求头，而本机宿主既可能是浏览器直连也可能是 Node 进程直连。\n\n 旧客户端不发送时三个字段都为空，观测端只留空而不是报错。"},"woohaa.canvas.v1.ClientTitle":{"type":"object","properties":{"title":{"type":"string","title":"title","description":"新的画布标题，≤512 字节，空串表示清空标题。"}},"title":"ClientTitle","additionalProperties":false,"description":"画布标题声明。\n\n 为什么走会话帧而不是另开一次 RenameCanvas：标题的权威值在客户端文档里（Yjs `meta.title`），\n 改名已经是画布命令，durable 之后 published 文档就有了新标题；同步链路只需要把它顺带\n 声明给服务端。另开 HTTP 调用会让\"本地已改名、服务端还是旧名\"之间存在第二条失败路径，\n 而且本机宿主并不持有可自行调用管理面 RPC 的会话。\n\n 服务端把它当**展示字段**：校验长度、只对可写连接应用、失败只记日志（不影响同步）；\n 不落 Yjs、不广播——其他客户端通过文档本身拿到标题。最后写入者生效。"},"woohaa.canvas.v1.ClientUpdate":{"type":"object","properties":{"clientSeq":{"oneOf":[{"type":"integer","title":"integer"},{"type":"string","title":"string"}],"title":"client_seq","description":"连接内唯一，用于匹配 UpdateAck；未确认的 update 由客户端在重连后重发。"},"update":{"type":"string","title":"update","format":"byte"}},"title":"ClientUpdate","additionalProperties":false,"description":"客户端产生的本地 Yjs update。"},"woohaa.canvas.v1.Hello":{"type":"object","properties":{"version":{"allOf":[{"title":"version"},{"$ref":"#/components/schemas/woohaa.canvas.v1.SessionProtocolVersion"}]},"roomEpoch":{"type":"string","title":"room_epoch","description":"客户端已有数据所属的 room epoch；为空或与服务端不一致时，服务端从头补发。"},"afterSeq":{"oneOf":[{"type":"integer","title":"integer"},{"type":"string","title":"string"}],"title":"after_seq"},"createIfMissing":{"type":"boolean","title":"create_if_missing","description":"客户端**本地已有内容、且这是首次把它推给远端**。\n\n 这套部署是本地优先：画布 id 在客户端生成，远端第一次见到某个 id 往往就是一次\n 同步推送。远端因此不能要求\"先调用 CreateCanvas 才能同步\"——那会让所有离线创建\n 的画布永远同步不上去。设置本字段即声明\"如果远端没见过这个 id，请登记它并把\n 本次调用者记为作者\"。\n\n 必须显式声明，不能由\"连上就登记\"推出：只读打开、以及本地缺失时拉远端快照\n （同样发空 room_epoch/after_seq）都不该变成一次认领。\n\n 远端已在别的属主名下时，这次连接以不可重试的 `canvas-taken` 结束。"},"title":{"type":"string","title":"title","description":"画布的展示标题，可选，最多 512 个字符。\n\n 画布内容（含标题）只存在于客户端文档里，服务端从不解析；因此管理端要展示可读的\n 画布名，只能由客户端在会话里顺带声明。它只用于展示与检索，**不参与**任何授权或\n 存在性判定，也不会覆盖一张已有标题的画布：服务端只在登记新画布、或已有画布标题\n 为空且调用者是作者时采用它（见 canvasacl.Claim）。\n\n 空串表示\"没有可声明的标题\"（旧客户端、未命名画布），服务端保持原值。"},"client":{"allOf":[{"title":"client","description":"客户端自报的展示元数据（可选）。见 ClientInfo。"},{"$ref":"#/components/schemas/woohaa.canvas.v1.ClientInfo"}]}},"title":"Hello","additionalProperties":false,"description":"连接后的第一帧；服务端收到前不发送任何文档内容。"},"woohaa.canvas.v1.ServerFrame":{"type":"object","allOf":[{"anyOf":[{"required":["ack"]},{"required":["awareness"]},{"required":["error"]},{"required":["synced"]},{"required":["update"]},{"required":["welcome"]},{"not":{"anyOf":[{"required":["ack"]},{"required":["awareness"]},{"required":["error"]},{"required":["synced"]},{"required":["update"]},{"required":["welcome"]}]}}]}],"anyOf":[{"required":["ack"]},{"required":["awareness"]},{"required":["error"]},{"required ient_seq"},"seq":{"oneOf":[{"type":"integer","title":"integer"},{"type":"string","title":"string"}],"title":"seq"}},"title":"UpdateAck","additionalProperties":false,"description":"ClientUpdate 已持久化。发起方不会再收到同一条 update 的 StoredUpdate 广播。"},"woohaa.canvas.v1.Welcome":{"type":"object","properties":{"version":{"allOf":[{"title":"version"},{"$ref":"#/components/schemas/woohaa.canvas.v1.SessionProtocolVersion"}]},"roomEpoch":{"type":"string","title":"room_epoch"},"actorId":{"type":"string","title":"actor_id"},"canWrite":{"type":"boolean","title":"can_write","description":"false 时服务端会丢弃该连接发来的 ClientUpdate。"}},"title":"Welcome","additionalProperties":false},"woohaa.canvas.v1.InspectorDirection":{"type":["string","integer"],"title":"InspectorDirection","enum":["INSPECTOR_DIRECTION_UNSPECIFIED",0,"INSPECTOR_DIRECTION_CLIENT_TO_SERVER",1,"INSPECTOR_DIRECTION_SERVER_TO_CLIENT",2,"INSPECTOR_DIRECTION_NOTICE",3],"description":"事件方向。"},"woohaa.canvas.v1.InspectorKind":{"type":["string","integer"],"title":"InspectorKind","enum":["INSPECTOR_KIND_UNSPECIFIED",0,"INSPECTOR_KIND_READY",1,"INSPECTOR_KIND_JOIN",2,"INSPECTOR_KIND_LEAVE",3,"INSPECTOR_KIND_UPDATE",4,"INSPECTOR_KIND_AWARENESS",5,"INSPECTOR_KIND_ERROR",6,"INSPECTOR_KIND_TITLE",7],"description":"事件种类。"},"google.protobuf.Timestamp":{"type":"string","format":"date-time","description":"A Timestamp represents a point in time independent of any time zone or local\n calendar, encoded as a count of seconds and fractions of seconds at\n nanosecond resolution. The count is relative to an epoch at UTC midnight on\n January 1, 1970, in the proleptic Gregorian calendar which extends the\n Gregorian calendar backwards to year one.\n\n All minutes are 60 seconds long. Leap seconds are \"smeared\" so that no leap\n second table is needed for interpretation, using a [24-hour linear\n smear](https://developers.google.com/time/smear).\n\n The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By\n restricting to that range, we ensure that we can convert to and from [RFC\n 3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.\n\n # Examples\n\n Example 1: Compute Timestamp from POSIX `time()`.\n\n     Timestamp timestamp;\n     timestamp.set_seconds(time(NULL));\n     timestamp.set_nanos(0);\n\n Example 2: Compute Timestamp from POSIX `gettimeofday()`.\n\n     struct timeval tv;\n     gettimeofday(&tv, NULL);\n\n     Timestamp timestamp;\n     timestamp.set_seconds(tv.tv_sec);\n     timestamp.set_nanos(tv.tv_usec * 1000);\n\n Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.\n\n     FILETIME ft;\n     GetSystemTimeAsFileTime(&ft);\n     UINT64 ticks = (((UINT64)ft.dwHighDateTime) \u003c\u003c 32) | ft.dwLowDateTime;\n\n     // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z\n     // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.\n     Timestamp timestamp;\n     timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));\n     timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));\n\n Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.\n\n     long millis = System.currentTimeMillis();\n\n     Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)\n         .setNanos((int) ((millis % 1000) * 1000000)).build();\n\n Example 5: Compute Timestamp from Java `Instant.now()`.\n\n     Instant now = Instant.now();\n\n     Timestamp timestamp =\n         Timestamp.newBuilder().setSeconds(now.getEpochSecond())\n             .setNanos(now.getNano()).build();\n\n Example 6: Compute Timestamp from current time in Python.\n\n     timestamp = Timestamp()\n     timestamp.GetCurrentTime()\n\n # JSON Mapping\n\n In JSON format, the Timestamp type is encoded as a string in the\n [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the\n format is \"{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z\"\n where {year} is always expressed using four digits while {month}, {day},\n {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional\n seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),\n are optional. The \"Z\" suffix indicates the timezone (\"UTC\"); the timezone\n is required. A ProtoJSON serializer should always use UTC (as indicated by\n \"Z\") when printing the Timestamp type and a ProtoJSON parser should be\n able to accept both UTC and other timezones (as indicated by an offset).\n\n For example, \"2017-01-15T01:30:15.01Z\" encodes 15.01 seconds past\n 01:30 UTC on January 15, 2017.\n\n In JavaScript, one can convert a Date object to this format using the\n standard\n [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)\n method. In Python, a standard `datetime.datetime` object can be converted\n to this format using\n [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with\n the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use\n the Joda Time's [`ISODateTimeFormat.dateTime()`](\n http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()\n ) to obtain a formatter capable of generating timestamps in this format."},"woohaa.canvas.v1.InspectorClient":{"type":"object","properties":{"clientNo":{"type":"integer","title":"client_no","description":"房间内连接编号，从 1 开始单调递增。重连是一条新连接，会拿到新编号；\n 房间回收（所有连接与观测者都离开）后重新从 1 开始。"},"actorId":{"type":"string","title":"actor_id","description":"鉴权主体（归属账号）。开发模式下是服务端生成的匿名 id。"},"displayName":{"type":"string","title":"display_name","description":"主体展示名（网关登录名或主体档案名），没有时为空。"},"subjectType":{"type":"string","title":"subject_type","description":"主体类型：`user`（人类）/ `machine`（机器凭证）。零值为空。"},"remoteAddr":{"type":"string","title":"remote_addr","description":"建连的 TCP 对端地址（含端口）。服务端在反向代理后面时这里是代理地址，\n 真实来源需要看 `forwarded_for`。"},"forwardedFor":{"type":"string","title":"forwarded_for","description":"握手请求里的 `X-Forwarded-For` 原文（未经过代理时为空）。服务端不解析、\n 不据此做任何判定；它可能被客户端伪造，只作为排障线索。"},"userAgent":{"type":"string","title":"user_agent","description":"握手请求里的 `User-Agent` 原文（客户端未提供时为空）。"},"clientName":{"type":"string","title":"client_name","description":"客户端在 Hello.client 里自报的产品名 / 版本 / 平台（旧客户端为空）。"},"clientVersion":{"type":"string","title":"client_version"},"platform":{"type":"string","title":"platform"},"joinedAt":{"allOf":[{"title":"joined_at","description":"这条连接加入房间的时刻（服务端时钟）。"},{"$ref":"#/components/schemas/google.protobuf.Timestamp"}]},"canWrite":{"type":"boolean","title":"can_write","description":"加入时该连接是否可写（与 Welcome.can_write 同源）。"}},"title":"InspectorClient","additionalProperties":false,"description":"一条客户端连接的身份与来源。所有字段都是**观测信息**，不参与任何判定。\n\n 数据来源分三类，界面必须按来源区分可信度：\n   1. 服务端在握手时观察到的：`remote_addr`、`forwarded_for`、`user_agent`；\n   2. 服务端鉴权得到的：`actor_id`、`display_name`、`subject_type`、`can_write`；\n   3. 客户端在 Hello 里自报的：`client_name`、`client_version`、`platform`（不可信）。"},"woohaa.canvas.v1.InspectorFrame":{"type":"object","properties":{"eventId":{"oneOf":[{"type":"integer","title":"integer"},{"type":"string","title":"string"}],"title":"event_id","description":"本实例内单调递增的事件序号，仅用于排序与定位，不跨实例。"},"at":{"allOf":[{"title":"at","description":"事件发生时刻，由服务端记录。"},{"$ref":"#/components/schemas/google.protobuf.Timestamp"}]},"direction":{"allOf":[{"title":"direction"},{"$ref":"#/components/schemas/woohaa.canvas.v1.InspectorDirection"}]},"kind":{"allOf":[{"title":"kind"},{"$ref":"#/components/schemas/woohaa.canvas.v1.InspectorKind"}]},"actorId":{"type":"string","title":"actor_id","description":"事件所属主体（客户端连接的身份）。NOTICE 与跨实例事件可能为空。"},"seq":{"oneOf":[{"type":"integer","title":"integer"},{"type":"string","title":"string"}],"title":"seq","description":"该事件对应记录的游标（UPDATE 事件）。"},"clientSeq":{"oneOf":[{"type":"integer","title":"integer"},{"type":"string","title":"string"}],"title":"client_seq","description":"客户端自报的 client_seq（UPDATE 事件），用于对照 UpdateAck。"},"snapshot":{"type":"boolean","title":"snapshot","description":"该记录是否是合并后的快照（UPDATE 事件）。"},"raw":{"type":"string","title":"raw","format":"byte","description":"原始载荷字节。READY 为空；JOIN 是客户端 Hello 的原始字节；UPDATE 是 Yjs update；\n AWARENESS 是 awareness 编码。跨实例事件保留转发过来的原始帧载荷。"},"size":{"oneOf":[{"type":"integer","title":"integer"},{"type":"string","title":"string"}],"title":"size","description":"`raw` 的字节数。单独给出是为了让界面不必先拿到载荷就能排序/聚合。"},"dropped":{"type":"integer","title":"dropped","description":"在本事件之前因订阅端消费过慢而被丢弃的事件数。0 表示没有丢弃。"},"remote":{"type":"boolean","title":"remote","description":"是否来自其他实例的跨实例转发。转发只在 update 与 awareness 上发生。"},"detail":{"type":"string","title":"detail","description":"人类可读的补充说明（断开原因、错误文本、就绪摘要）。不是机器可解析字段。"},"hello":{"allOf":[{"title":"hello","description":"仅 JOIN 事件携带：客户端 Hello 的结构化字段。`raw` 里是它的原始字节。"},{"$ref":"#/components/schemas/woohaa.canvas.v1.Hello"}]},"canWrite":{"type":"boolean","title":"can_write","description":"仅 JOIN 事件携带：本次连接是否可写（与 Welcome.can_write 同源）。"},"replayRecords":{"type":"integer","title":"replay_records","description":"仅 JOIN 事件携带：加入时补发的历史记录条数（含快照）。"},"session":{"allOf":[{"title":"session","description":"仅 READY 事件携带：订阅那一刻的房间状态。"},{"$ref":"#/components/schemas/woohaa.canvas.v1.InspectorSession"}]},"client":{"allOf":[{"title":"client","description":"事件所属的客户端连接描述。JOIN / LEAVE / UPDATE / AWARENESS / TITLE 携带；\n READY、跨实例转发帧与无法归属到某条连接的事件为空。\n\n 为什么需要它：`actor_id` 只到账号级别，同一账号开两个窗口、或两个设备用同一份\n 凭证时无法区分。`client_no` 把事件归属细化到**连接**，其余字段回答\"这条连接是\n 谁、从哪来、什么版本\"。"},{"$ref":"#/components/schemas/woohaa.canvas.v1.InspectorClient"}]}},"title":"InspectorFrame","additionalProperties":false,"description":"画布会话的实时观测通道（部署管理员专用，`GET /ws/admin/canvases/{canvas}`）。\n\n 这条通道**只读**：它不加入房间、不参与同步、不能写入，也不出现在其他协作者的\n awareness 里。它看到的是本实例上的会话活动；跨实例转发过来的帧也会作为\n `remote = true` 的服务端帧出现，但其他实例上客户端的原始行为不属于本实例的观测范围。\n\n 为什么不复用普通客户端连接：普通连接只能看到广播给自己的 ServerFrame，\n 看不到其他客户端发来的 ClientFrame（Hello、update、awareness），也看不到\n 连接建立/断开原因与\"补发了多少历史\"。观测通道把这些事实作为一等事件下发。\n\n 帧格式：每条 WebSocket binary message 恰好是一个 InspectorFrame。载荷字节\n （`raw`）原样保留，解析后的字段另外给出——排障既需要看到字节，也需要看到解释。"},"woohaa.canvas.v1.InspectorSession":{"type":"object","properties":{"canvasId":{"type":"string","title":"canvas_id"},"roomEpoch":{"type":"string","title":"room_epoch","description":"房间 epoch：客户端据此判断本地缓存是不是同一份数据。"},"headSeq":{"oneOf":[{"type":"integer","title":"integer"},{"type":"string","title":"string"}],"title":"head_seq","description":"当前最新一条记录的游标（快照为其覆盖到的最大 seq）。"},"recordCount":{"oneOf":[{"type":"integer","title":"integer"},{"type":"string","title":"string"}],"title":"record_count","description":"当前存储的记录条数（快照算一条）。"},"totalBytes":{"oneOf":[{"type":"integer","title":"integer"},{"type":"string","title":"string"}],"title":"total_bytes"},"clientConnections":{"type":"integer","title":"client_connections","description":"订阅那一刻房间内的客户端连接数（不含本观测连接）。"},"localInstanceOnly":{"type":"boolean","title":"local_instance_only","description":"观测范围。当前恒为 true：跨实例转发可见，其他实例的客户端行为不可见。"},"clients":{"type":"array","items":{"$ref":"#/components/schemas/woohaa.canvas.v1.InspectorClient"},"title":"clients","description":"订阅那一刻房间内每条客户端连接的描述，按 `client_no` 升序。\n\n 与 `client_connections` 冗余是有意的：前者是计数，后者能回答\"到底是谁连着\"。\n 之后加入的连接以 JOIN 事件出现，离开以 LEAVE 出现；`client_connections` 不再变化。"}},"title":"InspectorSession","additionalProperties":false,"description":"订阅那一刻的房间状态。它回答\"我接上的时候这张画布是什么样\"，\n 而不是一条随时间变化的时间线——后续变化以事件给出。"},"woohaa.diagnostics.v1alpha1.Level":{"type":["string","integer"],"title":"Level","enum":["LEVEL_UNSPECIFIED",0,"LEVEL_DEBUG",1,"LEVEL_INFO",2,"LEVEL_WARN",3,"LEVEL_ERROR",4],"description":"Local client diagnostics, not product analytics.\n\n This is the write side of \"the client saw something the server was not part\n of\": connection probes, login/device-code phases, sync upstream transitions\n and redacted error phrases. It is deliberately narrower than a log upload:\n entries carry stable identifiers plus a short sanitized message, never\n credentials, request/response bodies, media bytes, resource names or\n free-form user content.\n\n Entries are best-effort: a rejected or unavailable endpoi sponse","additionalProperties":false},"woohaa.telemetry.v1alpha1.StoredEvent":{"type":"object","properties":{"id":{"oneOf":[{"type":"integer","title":"integer","format":"int64"},{"type":"string","title":"string"}],"title":"id"},"actorId":{"type":"string","title":"actor_id","description":"Derived exclusively from the authenticated server context."},"receivedAt":{"allOf":[{"title":"received_at"},{"$ref":"#/components/schemas/google.protobuf.Timestamp"}]},"event":{"allOf":[{"title":"event"},{"$ref":"#/components/schemas/woohaa.telemetry.v1alpha1.ClientEvent"}]}},"title":"StoredEvent","additionalProperties":false}},"securitySchemes":{"bearerAuth":{"type":"http","scheme":"bearer","description":"使用部署配置的独立身份 token，不是 actor ID。公开接口无需 Authorization。"}}},"security":[],"tags":[{"name":"woohaa.canvas.v1.CanvasService","description":"画布接口。文档内容只通过 /ws 会话同步，服务端不解析 Yjs。"},{"name":"woohaa.diagnostics.v1alpha1.ClientDiagnosticsService","description":"Receives bounded client diagnostics reported by an authenticated client\n host. The host, not the browser, holds the session token; the browser only\n triggers the upload through the host's same-origin handler."},{"name":"woohaa.diagnostics.v1alpha1.DiagnosticsAdminService","description":"Reads diagnostics across all actors. Requires server-side administrative\n authorization. The read model is the retention window plus an opaque cursor:\n filters narrow that window, but there is still no aggregation or count — a\n page is a page, not a total. Cursors stay valid across filter changes only\n when the filters themselves stay the same."},{"name":"woohaa.generation.v1alpha1.GenerationService","description":"服务端托管生成。执行模型是\"客户端轮询\"：提交立即返回，读取轮询到终态。\n\n 调用方是本机宿主而不是浏览器，Bearer 会话只在宿主内。授权分两层：所有 RPC 都要求\n 已认证，涉及具体画布的 RPC 再按画布 ACL 判定（提交/取消要 `canvas.write`，读取要\n `canvas.read`）。目录是部署级读，不按画布过滤——它回答的是\"这台部署能提供什么\"。"},{"name":"woohaa.identity.v1alpha1.IdentityService","description":"IdentityService answers \"who are you\". It never answers \"what may you
