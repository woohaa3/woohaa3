version: v2
# Pin the Connect-aware generator; Go caches it without modifying either module.
# POST JSON is the documented transport. Read-only RPCs additionally support
# Connect GET; WebSocket framing remains documented by session.proto.
#
# `woohaa/recording/v1alpha1` is a local-only control plane over a private
# Unix-domain socket: it has no RPC service and is never exposed by the server.
# scripts/openapi.mjs passes `--exclude-path` for it so it stays in `gen/{go,es}`
# (buf.gen.yaml) while remaining out of the public HTTP contract.
plugins:
  - local: [go, run, github.com/sudorandom/protoc-gen-connect-openapi@v0.14.2]
    out: openapi
    strategy: all
    opt:
      - format=json
      - path=openapi.json
      - content-types=json
      - include-number-enum-values
