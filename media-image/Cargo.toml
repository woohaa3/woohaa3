[package]
name = "woohaa-media-image"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
threads = ["dep:rayon", "dep:wasm-bindgen-rayon"]

[dependencies]
rayon = { version = "=1.11.0", optional = true }
wasm-bindgen-rayon = { version = "=1.3.0", features = ["no-bundler"], optional = true }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
sqzer-codecs = { version = "=0.3.0", default-features = false, features = ["avif"] }
sqzer-core = "=0.3.0"
moxcms = "=0.8.1"
wasm-bindgen = "=0.2.128"

[profile.release]
opt-level = "s"
lto = true
