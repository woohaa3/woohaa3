packages:
  - vendor/*
  - contracts
  - frontend
  - ui
  - services/*
  - backend
  - runtime-components
  - extensions/*
  - ../extensions/*
  - ../packages/*
  - framework/*
  - test-fixtures/*
  - tooling
  - ui/showcase

# 工作区里有一处**刻意**的双向依赖：扩展包依赖 @woohaa3/frontend 拿公共 extension-api
# （`@woohaa3/frontend/extension-api` 是宿主 UI/对话框/面板的 facade，运行时经 shim 解析）；
# 而 frontend 的源码型测试（test-support/ 与 *.test.*）又显式 devDepend 扩展包来跑真实入口
# （边界守卫 extension-dependency-boundary.test.ts 明确允许这种用法）。
# 这不是要消除的偶然环：`pnpm -r` 的默认拓扑排序会因此失败，所以显式允许任意顺序。
ignoreWorkspaceCycles: true

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
allowBuilds:
  '@swc/core': true
  esbuild: true
  msw: true
  opencode-ai: true
  '@google/genai': false
  protobufjs: false
  cpu-features: false
  ssh2: false
  '@deepseek-ai/dsh-subprocess-local': true
  koffi: true
  node-pty: true
minimumReleaseAgeExclude:
  - '@openai/codex-sdk@0.161.0'
  - '@openai/codex@0.161.0-darwin-arm64 || 0.161.0-darwin-x64 || 0.161.0-linux-arm64 || 0.161.0-linux-x64 || 0.161.0-win32-arm64 || 0.161.0-win32-x64 || 0.161.0'
