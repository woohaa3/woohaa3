schema: spec-driven

# 项目上下文：供 AI 在生成本子项目 OpenSpec 产物时使用。
context: |
  PhotoCraft 是 Woohaa 的独立图像编辑子项目：固定上游快照 + 无 UI Rust 内核 + React 界面 +
  纯协议包 + Node 工程核验。它有**自己的** pnpm workspace、Cargo workspace、构建脚本与规格。

  边界（目录即架构）：
  - packages/protocol：纯协议（编辑定义、能力/版本、上限、内容身份、命令解码），零宿主依赖。
  - packages/editor：React 编辑器界面与内核端口（字体、预览、取景、Dialog、测量、预设存储）。
  - packages/project-verifier：Node-only 工程核验与原生子进程适配，浏览器不可达。
  - rust/：无 UI 编辑内核（editor-core）与原生核验工具（project-verify）。
  - vendor/photocraft：上游固定快照，逐字节原样，不修改。
  - integrations/woohaa：宿主适配包，由 Woohaa workspace 安装，不属于本工作区。

  核心不得 import Woohaa 的 frontend / services / contracts 实现或内部工具目录；共享语义只经
  tests/fixtures/contract.json 与 rust/project-limits.json 两份数据文件，两端各有测试读同一份。

  文档与规格用中文撰写。规格只描述当前仍成立的能力；计划与历史放 changes/。
  常用门禁：pnpm run check（build + typecheck + test）、pnpm run rust:test、
  pnpm run wasm、pnpm run verifier。
