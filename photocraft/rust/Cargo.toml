# PhotoCraft 嵌入宿主 crate 与构建入口
# （change: 2026-10-16-integrate-photocraft-image-editing，任务 1.1/1.2 / design D1/D5/D8）。
#
# 独立 workspace：不并入上游 `photocraft/vendor/photocraft` 的 workspace，也不并入 Bevy WASM。
# 通过**路径依赖**引用固定的上游 crate，因此上游源码与 `Cargo.lock` 保持只读、可核对。
#
# 成员：
# - `crates/project-verify`：原生无 UI 工程核验工具（Media 内部适配调用）；
# - `crates/editor-core`：React 图像编辑器的无 UI 编辑内核（原生可测 + wasm 绑定）。
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.95"

[workspace.dependencies]
photocraft-psd = { path = "../vendor/photocraft/crates/psd" }
photocraft-algo = { path = "../vendor/photocraft/crates/algo" }
photocraft-format = { path = "../vendor/photocraft/crates/format" }
photocraft-doc = { path = "../vendor/photocraft/crates/doc" }
photocraft-geom = { path = "../vendor/photocraft/crates/geom" }
photocraft-raster = { path = "../vendor/photocraft/crates/raster" }
photocraft-compose = { path = "../vendor/photocraft/crates/compose" }
photocraft-io = { path = "../vendor/photocraft/crates/io" }
photocraft-codecs = { path = "../vendor/photocraft/crates/codecs" }
photocraft-text = { path = "../vendor/photocraft/crates/text" }
photocraft-engine = { path = "../vendor/photocraft/crates/engine" }
photocraft-ops = { path = "../vendor/photocraft/crates/ops" }
photocraft-color = { path = "../vendor/photocraft/crates/color" }
photocraft-paint = { path = "../vendor/photocraft/crates/paint" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
log = "0.4"

# 浏览器产物按体积优化（与上游 `wasm-release` 同形）：fat LTO + 自身 crate `opt-level="z"`、
# 依赖 `"s"`，像素处理保持默认速度；`strip="debuginfo"` 去掉调试段。
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.wasm-release.package."*"]
opt-level = "s"

[profile.wasm-release.package.photocraft-codecs]
opt-level = "s"

[profile.wasm-release.package.photocraft-raster]
opt-level = 3

[profile.wasm-release.package.photocraft-compose]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
