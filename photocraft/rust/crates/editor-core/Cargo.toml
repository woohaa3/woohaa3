[package]
name = "photocraft-embed-editor"
description = "WooHaa3 React 图像编辑器的无 UI 编辑内核：把 PhotoCraft engine 暴露成纯字节/JSON 接口"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "photocraft_embed_editor"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
photocraft-psd = { workspace = true }
photocraft-algo = { workspace = true }
photocraft-project-verify = { path = "../project-verify" }
photocraft-doc = { workspace = true }
photocraft-geom = { workspace = true }
photocraft-compose = { workspace = true }
photocraft-raster = { workspace = true }
photocraft-codecs = { workspace = true }
photocraft-io = { workspace = true }
photocraft-text = { workspace = true }
photocraft-engine = { workspace = true }
photocraft-ops = { workspace = true }
photocraft-format = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
