[package]
name = "woohaa_bevy_canvas"
version = "0.1.0"
edition = "2024"
description = "Woohaa3 canvas runtime, ported from xyflow-bevy (change: replace-godot-canvas-runtime-with-bevy)"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Opt-in comparison renderer; default production stays on spatial/automatic.
explicit-instancing = []
default = ["wasm-webgpu"]
# 浏览器与原生宿主共用画布系统；平台事件循环由各 adapter 提供。
canvas-core = [
  "bevy/bevy_window", "bevy/bevy_sprite", "bevy/bevy_sprite_render",
  "bevy/bevy_text", "bevy/bevy_ui",
  # Parley otherwise uses ICU's non-complex segmenter and logs once per CJK run.
  "bevy/complex_script_segmentation",
]
# Tauri 提供真实窗口句柄与 OS 事件循环，不启用 bevy_winit。
native-canvas = ["canvas-core", "bevy/multi_threaded"]
# GPU 调试构建（change: 2026-10-14-migrate-canvas-to-tauri-native-bevy，design D8，任务 2.6）。
# 仅开启 Bevy 的 `debug` feature，让 pass/资源/系统名进入 GPU 抓帧标记；默认与 release
# 构建不携带，避免诊断开销和名称泄露。它是**独立开关**，不改变 canvas-core/native-canvas 语义。
gpu-debug = ["bevy/debug"]
# 浏览器 WASM 绑定（与具体 GPU 后端分离，两个浏览器后端都必须启用）。
# 保留 `wasm` feature 名称作为源码里的 wasm_bindgen/cfg 开关。
wasm = [
  "dep:wasm-bindgen", "dep:js-sys", "dep:wasm-bindgen-futures", "dep:console_error_panic_hook",
]
# 浏览器 WASM 运行时（WebGPU）：需要窗口/winit 与 WebGPU 后端。
wasm-webgpu = [
  "wasm",
  "canvas-core",
  "bevy/bevy_winit",
  "bevy/webgpu",
]
# 浏览器 WASM 运行时（WebGL2）：与 WebGPU 共用 Rust/ABI，但使用 wgpu 的 WebGL2 后端。
wasm-webgl2 = [
  "wasm",
  "canvas-core",
  "bevy/bevy_winit",
  "bevy/webgl2",
]
# 原生无窗口离屏渲染（model-renderer binary）：不创建窗口，不依赖 winit。
# 只做 Scene IR → 离屏 Image → PNG，与浏览器 adapter 共用 model3d 构建逻辑。
# 仍启用 bevy_window 抽象（WindowPlugin primary_window: None），因为 render 的
# camera_system 依赖 WindowResized 事件；但不启用 bevy_winit，因此不会有真实窗口。
native-renderer = [
  "bevy/png",
  "bevy/jpeg",
  "bevy/bevy_window",
  "bevy/multi_threaded",
  "dep:png",
  "dep:openh264",
]

[dependencies]
base64 = "0.22"
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "=0.4.78", optional = true }
bevy = { version = "=0.20.0", default-features = false, features = [
  "std", "async_executor", "bevy_asset", "bevy_color", "bevy_core_pipeline",
  "bevy_pbr", "bevy_render", "bevy_log",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
meshopt = "=0.6.2"
wasm-bindgen = { version = "=0.2.128", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
png = { version = "0.17", optional = true }
# 动态镜头视频编码（change: 2026-11-05-camera-shot-as-video）：仅原生构建启用，
# 浏览器 WASM 显式不可用而不是降级成图片。
openh264 = { version = "0.9.9", optional = true }

[[bin]]
name = "model-renderer"
path = "src/bin/model-renderer.rs"
required-features = ["native-renderer"]

[[bin]]
name = "world-video-encoder"
path = "src/bin/world-video-encoder.rs"
required-features = ["native-renderer"]

# hot_paths_golden 与 scope_golden 依赖 golden_api（native-renderer 门控）。
[[test]]
name = "hot_paths_golden"
required-features = ["native-renderer"]

[[bin]]
name = "mesh-lod-benchmark"
path = "src/bin/mesh-lod-benchmark.rs"
required-features = ["native-renderer"]

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 8
strip = "debuginfo"

# Keep dependency profiles stable; shrink only our runtime's growing control code.
# A single codegen unit avoids duplicated helpers across runtime modules.
[profile.release.package.woohaa_bevy_canvas]
opt-level = "z"
codegen-units = 1

[profile.dev]
# change: 2026-10-23-optimize-bevy-development-build（design D2）——开发模式优先增量与并行，
# 本项目代码保持较低优化，依赖仍按 opt-level=3 复用缓存。原生桌面用 desktop/Cargo.toml
# 的 profile，这里的设置只作用于 WASM 构建，不会被当成原生配置生效。
incremental = true
lto = false
opt-level = 1
debug = 0
codegen-units = 16

# 依赖只在首次或依赖变化时付出优化成本；普通源码小改优先复用。
[profile.dev.package."*"]
opt-level = 3
